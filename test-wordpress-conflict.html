<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Conflits WordPress - Sélecteur de Pays</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .phone-field-with-country {
        position: relative;
        z-index: 1000;
        border: 2px solid #ddd;
        padding: 10px;
        margin: 10px 0;
      }
      #simple-country-selector-container {
        border: 2px solid #007bff;
        padding: 5px;
        margin: 5px 0;
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }

      /* Simuler des styles WordPress qui pourraient interférer */
      .wp-admin,
      .wp-content {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }

      /* Simuler des styles de thème qui pourraient masquer */
      .theme-styles {
        position: relative;
        z-index: 999;
      }

      /* Simuler des styles de plugin */
      .plugin-styles {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>🧪 Test Conflits WordPress - Sélecteur de Pays</h1>

      <div id="status-container"></div>

      <!-- Simuler un environnement WordPress -->
      <div class="wp-admin theme-styles plugin-styles">
        <div class="form-group">
          <label for="phone">Téléphone (simulation WordPress)</label>
          <div class="phone-field-with-country">
            <div id="simple-country-selector-container"></div>
            <input id="client-phone" type="hidden" value="" />
          </div>
        </div>
      </div>

      <div
        id="debug-info"
        style="
          background: #f0f0f0;
          padding: 15px;
          border-radius: 8px;
          margin-top: 20px;
          font-family: monospace;
          font-size: 12px;
        "
      >
        <strong>Debug Info:</strong><br />
        Test des conflits WordPress...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="simulateWordPressConflict()"
          style="
            padding: 10px;
            margin: 5px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🔥 Simuler Conflit WordPress
        </button>
        <button
          onclick="fixWordPressConflict()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🔧 Corriger Conflit
        </button>
        <button
          onclick="checkZIndex()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          👁️ Vérifier Z-Index
        </button>
      </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message) {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();
        debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      function simulateWordPressConflict() {
        addDebug("🔥 === SIMULATION CONFLIT WORDPRESS ===");

        // Simuler des styles WordPress qui masquent le sélecteur
        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        if (container) {
          container.style.setProperty("display", "none", "important");
          container.style.setProperty("visibility", "hidden", "important");
          container.style.setProperty("opacity", "0", "important");
          container.style.setProperty("z-index", "-1", "important");
          addDebug("❌ Styles WordPress appliqués - sélecteur masqué");
          addStatus("❌ Sélecteur masqué par WordPress", "error");
        }
      }

      function fixWordPressConflict() {
        addDebug("🔧 === CORRECTION CONFLIT WORDPRESS ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        if (container) {
          // Forcer l'affichage malgré les conflits WordPress
          container.style.setProperty("display", "block", "important");
          container.style.setProperty("visibility", "visible", "important");
          container.style.setProperty("opacity", "1", "important");
          container.style.setProperty("position", "relative", "important");
          container.style.setProperty("z-index", "9999", "important");
          container.style.setProperty("background", "yellow", "important");
          container.style.setProperty("border", "3px solid red", "important");

          addDebug("✅ Styles de correction appliqués");
          addStatus("✅ Conflit WordPress corrigé", "success");
        }
      }

      function checkZIndex() {
        addDebug("👁️ === VÉRIFICATION Z-INDEX ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        if (container) {
          const computedStyle = window.getComputedStyle(container);
          const zIndex = computedStyle.zIndex;
          const display = computedStyle.display;
          const visibility = computedStyle.visibility;
          const opacity = computedStyle.opacity;

          addDebug(
            `📊 Container - Z-Index: ${zIndex}, Display: ${display}, Visibility: ${visibility}, Opacity: ${opacity}`
          );

          // Vérifier les parents
          let parent = container.parentElement;
          let level = 1;
          while (parent && level <= 5) {
            const parentStyle = window.getComputedStyle(parent);
            addDebug(
              `👨‍👩‍👧‍👦 Parent ${level} - Z-Index: ${parentStyle.zIndex}, Display: ${parentStyle.display}, Visibility: ${parentStyle.visibility}`
            );
            parent = parent.parentElement;
            level++;
          }
        }
      }

      function initSimpleCountrySelector() {
        addDebug("🔍 === DÉBUT INITIALISATION ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        if (!container) {
          addDebug("❌ Container non trouvé");
          addStatus("❌ Container non trouvé", "error");
          return;
        }

        addDebug("✅ Container trouvé");

        if (typeof SimpleCountrySelector === "undefined") {
          addDebug("❌ SimpleCountrySelector n'est pas défini");
          addStatus("❌ SimpleCountrySelector non disponible", "error");
          return;
        }

        try {
          container.innerHTML = "";
          addDebug("🔧 Container nettoyé");

          // Forcer l'affichage du container avec des styles très agressifs
          container.style.setProperty("display", "block", "important");
          container.style.setProperty("visibility", "visible", "important");
          container.style.setProperty("opacity", "1", "important");
          container.style.setProperty("position", "relative", "important");
          container.style.setProperty("z-index", "9999", "important");
          container.style.setProperty("min-height", "48px", "important");
          container.style.setProperty("width", "100%", "important");
          container.style.setProperty("background", "lightblue", "important");
          container.style.setProperty("border", "2px solid blue", "important");
          container.style.setProperty("overflow", "visible", "important");
          container.style.setProperty("clip", "auto", "important");

          addDebug("🔧 Styles agressifs appliqués");

          // Initialiser le sélecteur
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "FR",
            placeholder: "Numéro de téléphone",
          });

          addDebug("✅ Sélecteur créé");

          // Fonction pour récupérer le numéro complet
          window.getPhoneNumber = function () {
            return window.simpleCountrySelector
              ? window.simpleCountrySelector.getFullPhoneNumber()
              : "";
          };

          // Écouter les changements
          container.addEventListener("countryChanged", function (e) {
            addDebug("🌍 Pays sélectionné: " + e.detail.country.name);
          });

          addDebug("✅ Sélecteur de pays initialisé avec succès");
          addStatus("✅ Sélecteur de pays initialisé avec succès", "success");

          // Vérification finale
          setTimeout(() => {
            const phoneContainer = container.querySelector(
              ".simple-phone-container"
            );
            if (phoneContainer) {
              const rect = phoneContainer.getBoundingClientRect();
              const isVisible = rect.width > 0 && rect.height > 0;
              addDebug(
                `🔍 Vérification visibilité: ${isVisible} (${rect.width}x${rect.height})`
              );

              if (isVisible) {
                addStatus("✅ Sélecteur visible et fonctionnel", "success");
              } else {
                addStatus("⚠️ Sélecteur créé mais pas visible", "warning");
              }
            }
          }, 500);
        } catch (error) {
          addDebug("❌ Erreur lors de l'initialisation: " + error.message);
          addStatus(
            "❌ Erreur lors de l'initialisation: " + error.message,
            "error"
          );
        }
      }

      // Initialisation au chargement de la page
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("📄 Page chargée, simulation environnement WordPress");
        initSimpleCountrySelector();
      });
    </script>
  </body>
</html>
