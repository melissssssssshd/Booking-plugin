    <script>
      function addDebug(message) {
        const debugDiv = document.getElementById("debug");
        const time = new Date().toLocaleTimeString();
        debugDiv.innerHTML += `<div>[${time}] ${message}</div>`;
        debugDiv.scrollTop = debugDiv.scrollHeight;
      }

      function testFunctions() {
        addDebug("🧪 Test des fonctions Planity...");

        if (window.getPlanityPhoneNumber) {
          const phone = window.getPlanityPhoneNumber();
          addDebug(`✅ getPlanityPhoneNumber(): ${phone}`);
        } else {
          addDebug("❌ getPlanityPhoneNumber() non disponible");
        }

        if (window.getPlanityCountryCode) {
          const code = window.getPlanityCountryCode();
          addDebug(`✅ getPlanityCountryCode(): ${code}`);
        } else {
          addDebug("❌ getPlanityCountryCode() non disponible");
        }
      }

      // Initialisation
      addDebug("🚀 Page chargée");

      document.addEventListener("DOMContentLoaded", function () {
        addDebug("✅ DOM chargé");

        // Initialiser le sélecteur
        setTimeout(() => {
          if (typeof initPlanityPhoneSelector === "function") {
            initPlanityPhoneSelector();
            addDebug("✅ Sélecteur initialisé");
          } else {
            addDebug("❌ Fonction initPlanityPhoneSelector non trouvée");
          }
        }, 100);
      });
    </script>

    <script>
      // Fonction pour initialiser le sélecteur de pays Planity
      function initPlanityPhoneSelector() {
        const container = document.querySelector(".planity-phone-container");
        if (!container) {
          console.log("❌ Container Planity non trouvé");
          return;
        }

        const countrySelector = container.querySelector(
          ".planity-country-selector"
        );
        const dropdown = container.querySelector(".planity-country-dropdown");
        const phoneInput = container.querySelector("#client-phone");
        const countryItems = dropdown.querySelectorAll(".planity-country-item");

        if (!countrySelector || !dropdown || !phoneInput) {
          console.log("❌ Éléments Planity manquants");
          return;
        }

        console.log("✅ Initialisation du sélecteur Planity");

        // Variables pour le pays sélectionné
        let selectedCountry = {
          flag: "🇩🇿",
          dial: "+213",
          code: "DZ",
        };

        // Fonction pour mettre à jour l'affichage
        function updateDisplay() {
          const flagSpan = countrySelector.querySelector(".planity-flag");
          const dialSpan = countrySelector.querySelector(".planity-dial");

          if (flagSpan) flagSpan.textContent = selectedCountry.flag;
          if (dialSpan) dialSpan.textContent = selectedCountry.dial;
        }

        // Fonction pour fermer le dropdown
        function closeDropdown() {
          dropdown.style.display = "none";
          const arrow = countrySelector.querySelector(".planity-arrow");
          if (arrow) arrow.style.transform = "rotate(0deg)";
        }

        // Fonction pour ouvrir/fermer le dropdown
        function toggleDropdown() {
          const isOpen = dropdown.style.display === "block";

          if (isOpen) {
            closeDropdown();
          } else {
            dropdown.style.display = "block";
            const arrow = countrySelector.querySelector(".planity-arrow");
            if (arrow) arrow.style.transform = "rotate(180deg)";

            // Focus sur l'input après ouverture
            setTimeout(() => {
              phoneInput.focus();
            }, 100);
          }
        }

        // Événements pour le sélecteur de pays
        countrySelector.addEventListener("click", toggleDropdown);
        countrySelector.addEventListener("touchend", function (e) {
          e.preventDefault();
          toggleDropdown();
        });

        // Hover du sélecteur
        countrySelector.addEventListener("mouseenter", function () {
          this.style.background = "#f3f4f6";
        });

        countrySelector.addEventListener("mouseleave", function () {
          this.style.background = "#f9fafb";
        });

        // Événements pour les pays
        countryItems.forEach((item) => {
          const countryCode = item.getAttribute("data-country");
          const flag = item.querySelector("span").textContent;
          const dial = item.querySelector("span:last-child").textContent;

          item.addEventListener("click", function () {
            selectedCountry = {
              flag: flag,
              dial: dial,
              code: countryCode,
            };

            updateDisplay();
            closeDropdown();

            // Focus sur l'input
            setTimeout(() => {
              phoneInput.focus();
            }, 100);

            console.log("🌍 Pays sélectionné:", selectedCountry);
          });

          item.addEventListener("touchend", function (e) {
            e.preventDefault();
            this.click();
          });

          // Hover des pays
          item.addEventListener("mouseenter", function () {
            this.style.background = "#f9fafb";
            this.style.color = "#111827";
          });

          item.addEventListener("mouseleave", function () {
            this.style.background = "#ffffff";
            this.style.color = "#374151";
          });
        });

        // Focus du container
        phoneInput.addEventListener("focus", function () {
          container.style.background = "#ffffff";
          container.style.borderColor = "#374151";
          container.style.boxShadow = "0 0 0 3px rgba(55, 65, 81, 0.1)";
        });

        phoneInput.addEventListener("blur", function () {
          container.style.background = "#ffffff";
          container.style.borderColor = "#e5e7eb";
          container.style.boxShadow = "none";
        });

        // Fermer le dropdown en cliquant ailleurs
        document.addEventListener("click", function (e) {
          if (!container.contains(e.target)) {
            closeDropdown();
          }
        });

        // Fonctions globales pour récupérer les valeurs
        window.getPlanityPhoneNumber = function () {
          return (
            selectedCountry.dial +
            " " +
            phoneInput.value.replace(/^\+?[\d\s-]+/, "").trim()
          );
        };

        window.getPlanityPhoneNumberOnly = function () {
          return phoneInput.value;
        };

        window.getPlanityCountryCode = function () {
          return selectedCountry.dial;
        };

        console.log("✅ Sélecteur Planity initialisé avec succès");
      }
