<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Plugin WordPress - Barre de Progression</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 2rem;
        }
        .test-section {
            background: white;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-controls {
            text-align: center;
            margin: 2rem 0;
        }
        .test-controls button {
            background: #1f2937;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 0 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .test-controls button:hover {
            background: #374151;
        }
        .status-info {
            background: #f8f9fa;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-ok { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-warning { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="test-section">
        <h2>🧪 Test Plugin WordPress - Barre de Progression</h2>
        <div id="statusInfo">
            <p><span class="status-indicator" id="jsIndicator"></span><strong>JavaScript:</strong> <span id="jsStatus">Vérification...</span></p>
            <p><span class="status-indicator" id="domIndicator"></span><strong>DOM:</strong> <span id="domStatus">Vérification...</span></p>
            <p><span class="status-indicator" id="pluginIndicator"></span><strong>Plugin:</strong> <span id="pluginStatus">Vérification...</span></p>
        </div>
    </div>

    <!-- Simulation du contenu WordPress -->
    <div class="test-section">
        <h3>Contenu du plugin WordPress</h3>
        <div id="wordpress-content">
            <!-- Le contenu sera chargé ici -->
            <p style="text-align: center; color: #6b7280;">Chargement du contenu du plugin...</p>
        </div>
    </div>

    <!-- Contrôles de test -->
    <div class="test-section">
        <h3>Contrôles de test</h3>
        <div class="test-controls">
            <button onclick="testSetStep(1)">Étape 1</button>
            <button onclick="testSetStep(2)">Étape 2</button>
            <button onclick="testSetStep(3)">Étape 3</button>
            <button onclick="testSetStep(4)">Étape 4</button>
            <button onclick="testSetStep(5)">Étape 5</button>
        </div>
        
        <div style="text-align: center; margin-top: 1rem;">
            <button onclick="runFullDiagnostic()" style="background: #059669; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px;">
                🔍 Diagnostic complet
            </button>
            <button onclick="reloadPlugin()" style="background: #dc2626; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; margin-left: 0.5rem;">
                🔄 Recharger plugin
            </button>
        </div>
    </div>

    <!-- Informations de debug -->
    <div class="test-section">
        <h3>Informations de debug</h3>
        <div id="debugInfo" class="status-info">
            Chargement des informations de debug...
        </div>
    </div>

    <!-- Charger jQuery d'abord -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Variables globales pour simuler WordPress
        window.ajaxurl = "admin-ajax.php";
        window.ib_nonce = "test_nonce";
        window.bookingServices = [
            {id: 1, name: "Service Test 1"},
            {id: 2, name: "Service Test 2"}
        ];
        window.bookingEmployees = [
            {id: 1, name: "Employé Test 1"},
            {id: 2, name: "Employé Test 2"}
        ];

        function updateStatus() {
            const jsStatus = document.getElementById('jsStatus');
            const domStatus = document.getElementById('domStatus');
            const pluginStatus = document.getElementById('pluginStatus');
            const jsIndicator = document.getElementById('jsIndicator');
            const domIndicator = document.getElementById('domIndicator');
            const pluginIndicator = document.getElementById('pluginIndicator');
            
            // Vérifier JavaScript
            if (window.bookingState && typeof window.setStep === 'function' && typeof window.updateProgressBar === 'function') {
                jsStatus.textContent = `OK - Étape ${window.bookingState.step}`;
                jsIndicator.className = 'status-indicator status-ok';
            } else {
                jsStatus.textContent = 'Erreur - Fonctions non disponibles';
                jsIndicator.className = 'status-indicator status-error';
            }
            
            // Vérifier DOM
            const steps = document.querySelectorAll('.ib-stepper-main .ib-step');
            const progressBar = document.querySelector('.ib-stepper-main .ib-stepper-progress');
            
            if (steps.length > 0 && progressBar) {
                domStatus.textContent = `OK - ${steps.length} étapes trouvées`;
                domIndicator.className = 'status-indicator status-ok';
            } else {
                domStatus.textContent = `Erreur - Éléments manquants (${steps.length} étapes, ${progressBar ? 'barre OK' : 'pas de barre'})`;
                domIndicator.className = 'status-indicator status-error';
            }
            
            // Vérifier plugin
            const pluginContent = document.querySelector('#wordpress-content .planity-progress-bar');
            if (pluginContent) {
                pluginStatus.textContent = 'OK - Contenu chargé';
                pluginIndicator.className = 'status-indicator status-ok';
            } else {
                pluginStatus.textContent = 'En attente - Contenu non chargé';
                pluginIndicator.className = 'status-indicator status-warning';
            }
        }

        function testSetStep(step) {
            if (typeof window.setStep === 'function') {
                window.setStep(step);
                updateDebugInfo(`setStep(${step}) appelé`);
            } else {
                updateDebugInfo(`Erreur: window.setStep n'est pas disponible`);
            }
        }

        function updateDebugInfo(message) {
            const debugInfo = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            debugInfo.innerHTML += `[${timestamp}] ${message}\n`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        function runFullDiagnostic() {
            updateDebugInfo('=== DIAGNOSTIC COMPLET ===');
            updateDebugInfo(`window.bookingState: ${window.bookingState ? JSON.stringify(window.bookingState) : 'undefined'}`);
            updateDebugInfo(`typeof window.setStep: ${typeof window.setStep}`);
            updateDebugInfo(`typeof window.updateProgressBar: ${typeof window.updateProgressBar}`);
            
            const steps = document.querySelectorAll('.ib-stepper-main .ib-step');
            const progressBar = document.querySelector('.ib-stepper-main .ib-stepper-progress');
            updateDebugInfo(`Étapes DOM: ${steps.length}`);
            updateDebugInfo(`Barre progression: ${progressBar ? 'trouvée' : 'non trouvée'}`);
            
            updateDebugInfo('=== FIN DIAGNOSTIC ===');
            updateStatus();
        }

        function loadPluginContent() {
            updateDebugInfo('Chargement du contenu du plugin...');
            
            // Charger le contenu du fichier partials/booking-form.php (simulé)
            fetch('partials/booking-form.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Fichier PHP non accessible, chargement du template HTML');
                    }
                    return response.text();
                })
                .catch(() => {
                    // Fallback vers le template HTML
                    return fetch('templates/booking-form.html').then(r => r.text());
                })
                .then(html => {
                    document.getElementById('wordpress-content').innerHTML = html;
                    updateDebugInfo('Contenu HTML chargé');
                    
                    // Charger le JavaScript du plugin
                    const script = document.createElement('script');
                    script.src = 'assets/js/booking-form-main.js';
                    script.onload = function() {
                        updateDebugInfo('Script booking-form-main.js chargé');
                        setTimeout(() => {
                            updateStatus();
                            runFullDiagnostic();
                        }, 1000);
                    };
                    script.onerror = function() {
                        updateDebugInfo('Erreur lors du chargement de booking-form-main.js');
                    };
                    document.head.appendChild(script);
                })
                .catch(error => {
                    updateDebugInfo(`Erreur: ${error.message}`);
                    document.getElementById('wordpress-content').innerHTML = 
                        '<p style="text-align: center; color: red;">Erreur lors du chargement du contenu</p>';
                });
        }

        function reloadPlugin() {
            document.getElementById('debugInfo').innerHTML = '';
            updateDebugInfo('Rechargement du plugin...');
            loadPluginContent();
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            updateDebugInfo('DOM chargé, initialisation...');
            loadPluginContent();
            
            // Mise à jour du statut toutes les 2 secondes
            setInterval(updateStatus, 2000);
        });
    </script>
</body>
</html>
