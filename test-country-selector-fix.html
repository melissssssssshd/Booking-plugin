<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Sélecteur de Pays - Correction</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .test-title {
        color: #333;
        text-align: center;
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
      }
      .phone-field-with-country {
        position: relative;
        z-index: 1000;
      }
      #simple-country-selector-container {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        position: relative !important;
        z-index: 1000 !important;
        min-height: 48px !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      .debug-info {
        background: #f0f0f0;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-family: monospace;
        font-size: 12px;
        max-height: 200px;
        overflow-y: auto;
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1 class="test-title">🧪 Test Sélecteur de Pays - Correction</h1>

      <div id="status-container"></div>

      <form id="test-form">
        <div class="form-group">
          <label for="name">Nom complet</label>
          <input
            type="text"
            id="name"
            placeholder="Votre nom"
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 6px;
              font-size: 16px;
            "
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Votre email"
            style="
              width: 100%;
              padding: 12px;
              border: 1px solid #ddd;
              border-radius: 6px;
              font-size: 16px;
            "
          />
        </div>

        <div class="form-group">
          <label for="phone">Téléphone</label>
          <div class="phone-field-with-country">
            <div id="simple-country-selector-container"></div>
            <input id="client-phone" type="hidden" value="" />
          </div>
        </div>

        <button
          type="submit"
          style="
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
          "
        >
          Tester le formulaire
        </button>
      </form>

      <div class="debug-info" id="debug-info">
        <strong>Debug Info:</strong><br />
        En attente d'initialisation...
      </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      // Fonction pour ajouter des messages de statut
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      // Fonction pour ajouter des messages de debug
      function addDebug(message) {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();
        debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      // Fonction d'initialisation améliorée
      function initSimpleCountrySelector() {
        addDebug("🔍 Début initSimpleCountrySelector");

        const waitForContainer = () => {
          const container = document.querySelector(
            "#simple-country-selector-container"
          );
          if (!container) {
            addDebug(
              "⏳ Container non trouvé, nouvelle tentative dans 50ms..."
            );
            setTimeout(waitForContainer, 50);
            return;
          }

          addDebug("✅ Container trouvé");
          initializeSelector(container);
        };

        const initializeSelector = (container) => {
          addDebug(
            "🔍 Container HTML avant: " +
              container.innerHTML.substring(0, 100) +
              "..."
          );

          if (typeof SimpleCountrySelector === "undefined") {
            addDebug("❌ SimpleCountrySelector n'est pas défini");
            setTimeout(() => {
              if (typeof SimpleCountrySelector !== "undefined") {
                initializeSelector(container);
              } else {
                addDebug("❌ SimpleCountrySelector toujours non disponible");
                addStatus(
                  "Erreur: SimpleCountrySelector non disponible",
                  "error"
                );
              }
            }, 200);
            return;
          }

          try {
            container.innerHTML = "";
            addDebug("🔧 Container nettoyé");

            // Forcer l'affichage du container
            container.style.setProperty("display", "block", "important");
            container.style.setProperty("visibility", "visible", "important");
            container.style.setProperty("opacity", "1", "important");
            container.style.setProperty("position", "relative", "important");
            container.style.setProperty("z-index", "1000", "important");
            container.style.setProperty("min-height", "48px", "important");
            container.style.setProperty("width", "100%", "important");

            // Initialiser le sélecteur
            window.simpleCountrySelector = new SimpleCountrySelector(
              container,
              {
                defaultCountry: "FR",
                placeholder: "Numéro de téléphone",
              }
            );

            addDebug("✅ Sélecteur créé");

            // Fonction pour récupérer le numéro complet
            window.getPhoneNumber = function () {
              return window.simpleCountrySelector
                ? window.simpleCountrySelector.getFullPhoneNumber()
                : "";
            };

            // Écouter les changements
            container.addEventListener("countryChanged", function (e) {
              addDebug("🌍 Pays sélectionné: " + e.detail.country.name);
              const hiddenInput = document.querySelector("#client-phone");
              if (hiddenInput) {
                hiddenInput.value = window.getPhoneNumber();
              }
            });

            const phoneInput = container.querySelector(".simple-phone-input");
            if (phoneInput) {
              phoneInput.addEventListener("input", function () {
                const hiddenInput = document.querySelector("#client-phone");
                if (hiddenInput) {
                  hiddenInput.value = window.getPhoneNumber();
                }
              });
            }

            addDebug("✅ Sélecteur de pays initialisé avec succès");
            addStatus("✅ Sélecteur de pays initialisé avec succès", "success");

            // Vérification finale
            setTimeout(() => {
              const phoneContainer = container.querySelector(
                ".simple-phone-container"
              );
              if (phoneContainer) {
                const isVisible =
                  phoneContainer.offsetWidth > 0 &&
                  phoneContainer.offsetHeight > 0;
                addDebug("🔍 Vérification visibilité: " + isVisible);

                if (isVisible) {
                  addStatus("✅ Sélecteur visible et fonctionnel", "success");
                } else {
                  addStatus("⚠️ Sélecteur créé mais pas visible", "warning");
                }
              }
            }, 500);
          } catch (error) {
            addDebug("❌ Erreur lors de l'initialisation: " + error.message);
            addStatus("❌ Erreur lors de l'initialisation", "error");
          }
        };

        waitForContainer();
      }

      // Initialisation au chargement de la page
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("📄 Page chargée, début de l'initialisation");

        // Initialisation avec plusieurs tentatives
        initSimpleCountrySelector();
        setTimeout(initSimpleCountrySelector, 200);
        setTimeout(initSimpleCountrySelector, 500);
        setTimeout(initSimpleCountrySelector, 1000);
      });

      // Test du formulaire
      document
        .getElementById("test-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const phone = window.getPhoneNumber ? window.getPhoneNumber() : "";

          addDebug("📝 Test du formulaire:");
          addDebug("  - Nom: " + name);
          addDebug("  - Email: " + email);
          addDebug("  - Téléphone: " + phone);

          if (phone) {
            addStatus("✅ Numéro de téléphone récupéré: " + phone, "success");
          } else {
            addStatus("❌ Aucun numéro de téléphone récupéré", "error");
          }
        });
    </script>
  </body>
</html>
