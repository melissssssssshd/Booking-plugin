<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test PDF Compact - Ticket de Réservation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
      .preview {
        border: 2px solid #ddd;
        padding: 20px;
        margin: 20px 0;
        background: white;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>📄 Test PDF Compact - Ticket de Réservation</h1>

      <div id="status-container"></div>

      <div class="preview">
        <h3>📋 Aperçu du contenu du ticket :</h3>
        <div id="ticket-preview"></div>
      </div>

      <div
        id="debug-info"
        style="
          background: #f0f0f0;
          padding: 15px;
          border-radius: 8px;
          margin-top: 20px;
          font-family: monospace;
          font-size: 12px;
        "
      >
        <strong>Debug Info:</strong><br />
        Test de génération PDF compact...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="generateCompactPDF()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          📄 Générer PDF Compact
        </button>
        <button
          onclick="showTicketPreview()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          👁️ Aperçu Ticket
        </button>
        <button
          onclick="checkPDFSize()"
          style="
            padding: 10px;
            margin: 5px;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
          "
        >
          📏 Vérifier Taille
        </button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message) {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();
        debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      // Données de test
      const testBookingData = {
        service: "Patine",
        employee: "Lamia",
        date: "lundi 4 août 2025",
        slot: "09:00",
        client: "sissi had",
        email: "melissa@gmail.com",
        phone: "+213 558769610",
        price: "de 3 000 DA à 5 000 DA",
      };

      function showTicketPreview() {
        addDebug("👁️ === APERÇU TICKET ===");

        const preview = document.getElementById("ticket-preview");
        preview.innerHTML = `
                <div style="width: 100%; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; font-family: Arial, sans-serif; color: #000000; max-height: 800px; overflow: hidden;">
                    <div style="text-align: center; margin-bottom: 10px;">
                        <div style="width: 30px; height: 30px; background: #374151; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold;">✓</div>
                    </div>
                    <div style="background: #374151; color: #ffffff; padding: 8px 15px; border-radius: 6px; font-weight: 600; text-align: center; margin: 10px 0; font-size: 14px;">Réservation confirmée</div>
                    <div style="text-align: center; color: #374151; margin: 10px 0; font-size: 12px; line-height: 1.3;">Merci pour votre réservation !<br>Un email de confirmation vous a été envoyé.</div>
                    <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; margin: 15px 0;">
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Service</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.service
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Praticienne</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.employee
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Date</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.date
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Créneau</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.slot
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Client</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.client
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Email</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.email
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Téléphone</span><span style="color: #111827; font-size: 12px;">${
                          testBookingData.phone
                        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0;"><span style="font-weight: 600; color: #374151; font-size: 12px;">Prix</span><span style="color: #111827; font-weight: 600; font-size: 12px;">${
                          testBookingData.price
                        }</span></div>
                    </div>
                    <div style="text-align: center; color: #6b7280; font-size: 10px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #e5e7eb;">Ticket généré le ${new Date().toLocaleDateString(
                      "fr-FR"
                    )} à ${new Date().toLocaleTimeString("fr-FR")}</div>
                </div>
            `;

        addStatus("✅ Aperçu du ticket affiché", "success");
      }

      function generateCompactPDF() {
        addDebug("📄 === GÉNÉRATION PDF COMPACT ===");

        if (!window.html2canvas || !window.jsPDF) {
          addDebug("❌ Bibliothèques PDF non disponibles");
          addStatus("❌ Bibliothèques PDF manquantes", "error");
          return;
        }

        // Créer un conteneur temporaire
        const tempContainer = document.createElement("div");
        const containerWidth = 600;
        const containerPadding = 15;
        const fontSize = 12;
        const iconSize = 30;
        const titleFontSize = 14;

        tempContainer.style.cssText = `
                position: fixed;
                left: 0;
                top: 0;
                width: ${containerWidth}px;
                height: auto;
                background: white;
                padding: ${containerPadding}px;
                font-family: Arial, sans-serif;
                color: black;
                box-sizing: border-box;
                z-index: -9999;
                visibility: hidden;
            `;

        // Contenu HTML compact
        tempContainer.innerHTML = `
                <div style="width: 100%; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: ${containerPadding}px; font-family: Arial, sans-serif; color: #000000; max-height: 800px; overflow: hidden;">
                    <div style="text-align: center; margin-bottom: 10px;">
                        <div style="width: ${iconSize}px; height: ${iconSize}px; background: #374151; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: white; font-size: ${
          iconSize * 0.4
        }px; font-weight: bold;">✓</div>
                    </div>
                    <div style="background: #374151; color: #ffffff; padding: 8px 15px; border-radius: 6px; font-weight: 600; text-align: center; margin: 10px 0; font-size: ${titleFontSize}px;">Réservation confirmée</div>
                    <div style="text-align: center; color: #374151; margin: 10px 0; font-size: ${fontSize}px; line-height: 1.3;">Merci pour votre réservation !<br>Un email de confirmation vous a été envoyé.</div>
                    <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; margin: 15px 0;">
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Service</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.service
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Praticienne</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.employee
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Date</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.date
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Créneau</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.slot
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Client</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.client
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Email</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.email
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e5e7eb;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Téléphone</span><span style="color: #111827; font-size: ${fontSize}px;">${
          testBookingData.phone
        }</span></div>
                        <div style="display: flex; justify-content: space-between; padding: 5px 0;"><span style="font-weight: 600; color: #374151; font-size: ${fontSize}px;">Prix</span><span style="color: #111827; font-weight: 600; font-size: ${fontSize}px;">${
          testBookingData.price
        }</span></div>
                    </div>
                    <div style="text-align: center; color: #6b7280; font-size: 10px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #e5e7eb;">Ticket généré le ${new Date().toLocaleDateString(
                      "fr-FR"
                    )} à ${new Date().toLocaleTimeString("fr-FR")}</div>
                </div>
            `;

        document.body.appendChild(tempContainer);
        tempContainer.offsetHeight;
        tempContainer.style.visibility = "visible";

        addDebug("📄 Conteneur temporaire créé");
        addDebug(
          `📊 Dimensions: ${tempContainer.offsetWidth} x ${tempContainer.offsetHeight}`
        );

        setTimeout(() => {
          try {
            html2canvas(tempContainer, {
              scale: 1.5,
              backgroundColor: "#ffffff",
              logging: false,
              useCORS: true,
              allowTaint: true,
              width: containerWidth,
              height: tempContainer.offsetHeight,
              scrollX: 0,
              scrollY: 0,
              windowWidth: containerWidth,
              windowHeight: tempContainer.offsetHeight,
            })
              .then((canvas) => {
                addDebug(
                  `📊 Canvas généré: ${canvas.width} x ${canvas.height}`
                );

                const imgData = canvas.toDataURL("image/png");
                const pdf = new jsPDF("p", "mm", "a4");
                const imgWidth = 180;
                const pageHeight = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                const xOffset = (210 - imgWidth) / 2;
                const yOffset = (pageHeight - imgHeight) / 2;

                if (imgHeight <= pageHeight) {
                  pdf.addImage(
                    imgData,
                    "PNG",
                    xOffset,
                    yOffset,
                    imgWidth,
                    imgHeight
                  );
                  addDebug("✅ PDF généré sur une seule page");
                } else {
                  const scale = pageHeight / imgHeight;
                  const scaledWidth = imgWidth * scale;
                  const scaledHeight = imgHeight * scale;
                  const scaledXOffset = (210 - scaledWidth) / 2;

                  pdf.addImage(
                    imgData,
                    "PNG",
                    scaledXOffset,
                    10,
                    scaledWidth,
                    scaledHeight
                  );
                  addDebug("✅ PDF redimensionné pour tenir sur une page");
                }

                pdf.save(
                  `ticket-reservation-test-${
                    new Date().toISOString().split("T")[0]
                  }.pdf`
                );

                addDebug("🎉 PDF compact généré avec succès");
                addStatus("✅ PDF compact généré avec succès", "success");

                if (document.body.contains(tempContainer)) {
                  document.body.removeChild(tempContainer);
                }
              })
              .catch((error) => {
                addDebug("❌ Erreur canvas: " + error.message);
                addStatus("❌ Erreur lors de la génération", "error");
                if (document.body.contains(tempContainer)) {
                  document.body.removeChild(tempContainer);
                }
              });
          } catch (error) {
            addDebug("❌ Erreur générale: " + error.message);
            addStatus("❌ Erreur lors de la génération", "error");
            if (document.body.contains(tempContainer)) {
              document.body.removeChild(tempContainer);
            }
          }
        }, 500);
      }

      function checkPDFSize() {
        addDebug("📏 === VÉRIFICATION TAILLE ===");

        const preview = document.getElementById("ticket-preview");
        if (preview.children.length > 0) {
          const ticketElement = preview.children[0];
          const rect = ticketElement.getBoundingClientRect();

          addDebug(`📊 Hauteur du ticket: ${rect.height}px`);
          addDebug(`📊 Largeur du ticket: ${rect.width}px`);

          // Estimation de la taille en PDF (A4 = 210x297mm)
          const estimatedHeight = (rect.height * 180) / rect.width; // 180mm = largeur PDF

          addDebug(
            `📊 Hauteur estimée en PDF: ${estimatedHeight.toFixed(1)}mm`
          );

          if (estimatedHeight <= 297) {
            addStatus("✅ Le ticket tiendra sur une seule page A4", "success");
          } else {
            addStatus(
              "⚠️ Le ticket pourrait déborder sur une deuxième page",
              "warning"
            );
          }
        } else {
          addStatus("❌ Aucun aperçu disponible", "error");
        }
      }

      // Initialisation
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("📄 Page chargée, test PDF compact");
        showTicketPreview();
      });
    </script>
  </body>
</html>
