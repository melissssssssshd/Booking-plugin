<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Capture Numéro - Sélecteur de Pays</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .phone-field-with-country {
            position: relative;
            z-index: 1000;
            border: 2px solid #ddd;
            padding: 10px;
            margin: 10px 0;
        }
        #simple-country-selector-container {
            border: 2px solid #007bff;
            padding: 5px;
            margin: 5px 0;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: 500;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.warning { background: #fff3cd; color: #856404; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .form-group {
            margin: 15px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📞 Test Capture Numéro - Sélecteur de Pays</h1>
        
        <div id="status-container"></div>
        
        <form id="test-form">
            <div class="form-group">
                <label for="firstname">Prénom</label>
                <input type="text" id="firstname" value="sissi">
            </div>
            
            <div class="form-group">
                <label for="lastname">Nom</label>
                <input type="text" id="lastname" value="had">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="lou@gmail.com">
            </div>
            
            <div class="form-group">
                <label for="phone">Téléphone</label>
                <div class="phone-field-with-country">
                    <div id="simple-country-selector-container"></div>
                    <input id="client-phone" type="hidden" value="">
                </div>
            </div>
            
            <button type="submit" id="submit-btn" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Valider la réservation
            </button>
        </form>
        
        <div id="debug-info" style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px;">
            <strong>Debug Info:</strong><br>
            Test de capture du numéro...
        </div>
        
        <div style="margin-top: 20px;">
            <button onclick="testPhoneCapture()" style="padding: 10px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px;">
                📞 Tester Capture Numéro
            </button>
            <button onclick="testFullNumber()" style="padding: 10px; margin: 5px; background: #28a745; color: white; border: none; border-radius: 4px;">
                📋 Tester Numéro Complet
            </button>
            <button onclick="testValidation()" style="padding: 10px; margin: 5px; background: #ffc107; color: black; border: none; border-radius: 4px;">
                ✅ Tester Validation
            </button>
            <button onclick="clearPhone()" style="padding: 10px; margin: 5px; background: #dc3545; color: white; border: none; border-radius: 4px;">
                🗑️ Effacer Numéro
            </button>
        </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
        function addStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            container.appendChild(statusDiv);
        }

        function addDebug(message) {
            const debugInfo = document.getElementById('debug-info');
            const timestamp = new Date().toLocaleTimeString();
            debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        function testPhoneCapture() {
            addDebug("📞 === TEST CAPTURE NUMÉRO ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            const phoneInput = container.querySelector(".simple-phone-input");
            
            if (phoneInput) {
                // Saisir le numéro complet
                phoneInput.value = "558769610";
                phoneInput.dispatchEvent(new Event('input'));
                
                addDebug("📞 Numéro saisi: 558769610");
                
                // Vérifier ce qui est capturé
                const capturedNumber = phoneInput.value;
                const fullNumber = window.getPlanityPhoneNumber();
                const countryCode = window.getPlanityCountryCode();
                
                addDebug(`📊 Numéro capturé: ${capturedNumber}`);
                addDebug(`📊 Code pays: ${countryCode}`);
                addDebug(`📊 Numéro complet: ${fullNumber}`);
                
                // Vérifier que tous les chiffres sont présents
                if (capturedNumber === "558769610" && fullNumber === "+213 558769610") {
                    addStatus("✅ Numéro correctement capturé", "success");
                } else {
                    addStatus("❌ Numéro mal capturé", "error");
                    addDebug(`❌ Erreur: ${capturedNumber} vs 558769610 attendu`);
                    addDebug(`❌ Erreur: ${fullNumber} vs +213 558769610 attendu`);
                }
            }
        }

        function testFullNumber() {
            addDebug("📋 === TEST NUMÉRO COMPLET ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            const phoneInput = container.querySelector(".simple-phone-input");
            
            if (phoneInput) {
                // Tester différents numéros
                const testNumbers = [
                    "558769610",
                    "123456789",
                    "987654321",
                    "555123456"
                ];
                
                testNumbers.forEach((num, index) => {
                    phoneInput.value = num;
                    phoneInput.dispatchEvent(new Event('input'));
                    
                    const fullNumber = window.getPlanityPhoneNumber();
                    const expected = `+213 ${num}`;
                    
                    addDebug(`📞 Test ${index + 1}: ${num} → ${fullNumber}`);
                    
                    if (fullNumber === expected) {
                        addDebug(`✅ Test ${index + 1}: OK`);
                    } else {
                        addDebug(`❌ Test ${index + 1}: ÉCHEC (${fullNumber} vs ${expected})`);
                    }
                });
                
                addStatus("✅ Tests de numéros complets terminés", "success");
            }
        }

        function testValidation() {
            addDebug("✅ === TEST VALIDATION ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            const phoneInput = container.querySelector(".simple-phone-input");
            
            if (phoneInput) {
                // Saisir un numéro valide
                phoneInput.value = "558769610";
                phoneInput.dispatchEvent(new Event('input'));
                
                addDebug("📞 Numéro saisi pour validation: 558769610");
                
                // Simuler la validation
                const fullNumber = window.getPlanityPhoneNumber();
                const countryCode = window.getPlanityCountryCode();
                const phoneOnly = phoneInput.value;
                
                addDebug(`📊 Numéro saisi: ${phoneOnly}`);
                addDebug(`📊 Code pays: ${countryCode}`);
                addDebug(`📊 Numéro complet: ${fullNumber}`);
                
                // Vérifier la validation
                const isValid = fullNumber && fullNumber.length > 10 && countryCode === "213";
                
                if (isValid) {
                    addStatus("✅ Validation réussie", "success");
                } else {
                    addStatus("❌ Validation échouée", "error");
                }
            }
        }

        function clearPhone() {
            addDebug("🗑️ === EFFACER NUMÉRO ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            const phoneInput = container.querySelector(".simple-phone-input");
            
            if (phoneInput) {
                phoneInput.value = "";
                phoneInput.dispatchEvent(new Event('input'));
                
                addDebug("🗑️ Numéro effacé");
                
                const fullNumber = window.getPlanityPhoneNumber();
                addDebug(`📊 Numéro après effacement: "${fullNumber}"`);
                
                if (fullNumber === "+213 ") {
                    addStatus("✅ Effacement réussi", "success");
                } else {
                    addStatus("❌ Effacement échoué", "error");
                }
            }
        }

        function initSimpleCountrySelector() {
            addDebug("🔍 === DÉBUT INITIALISATION ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            if (!container) {
                addDebug("❌ Container non trouvé");
                addStatus("❌ Container non trouvé", "error");
                return;
            }
            
            addDebug("✅ Container trouvé");
            
            if (typeof SimpleCountrySelector === "undefined") {
                addDebug("❌ SimpleCountrySelector n'est pas défini");
                addStatus("❌ SimpleCountrySelector non disponible", "error");
                return;
            }

            try {
                container.innerHTML = "";
                addDebug("🔧 Container nettoyé");

                // Forcer l'affichage du container
                container.style.setProperty("display", "block", "important");
                container.style.setProperty("visibility", "visible", "important");
                container.style.setProperty("opacity", "1", "important");
                container.style.setProperty("position", "relative", "important");
                container.style.setProperty("z-index", "1000", "important");
                container.style.setProperty("min-height", "48px", "important");
                container.style.setProperty("width", "100%", "important");

                addDebug("🔧 Styles de base appliqués");

                // Initialiser le sélecteur avec Algérie par défaut
                window.simpleCountrySelector = new SimpleCountrySelector(container, {
                    defaultCountry: "DZ",
                    placeholder: "Numéro de téléphone",
                });

                addDebug("✅ Sélecteur créé");

                // Fonction pour récupérer le numéro complet
                window.getPhoneNumber = function () {
                    return window.simpleCountrySelector
                        ? window.simpleCountrySelector.getFullPhoneNumber()
                        : "";
                };

                // Écouter les changements
                container.addEventListener("countryChanged", function (e) {
                    addDebug("🌍 Pays sélectionné: " + e.detail.country.name);
                });

                addDebug("✅ Sélecteur de pays initialisé avec succès");
                addStatus("✅ Sélecteur de pays initialisé avec succès", "success");

                // Vérification finale
                setTimeout(() => {
                    const phoneContainer = container.querySelector(".simple-phone-container");
                    const dropdown = container.querySelector(".simple-dropdown");
                    
                    if (phoneContainer) {
                        const rect = phoneContainer.getBoundingClientRect();
                        const isVisible = rect.width > 0 && rect.height > 0;
                        addDebug(`🔍 Vérification visibilité: ${isVisible} (${rect.width}x${rect.height})`);
                        
                        if (isVisible) {
                            addStatus("✅ Sélecteur visible et fonctionnel", "success");
                        } else {
                            addStatus("⚠️ Sélecteur créé mais pas visible", "warning");
                        }
                    }
                    
                    if (dropdown) {
                        addDebug("✅ Dropdown créé");
                        addStatus("✅ Dropdown créé", "success");
                    } else {
                        addDebug("❌ Dropdown non créé");
                        addStatus("❌ Dropdown non créé", "error");
                    }
                }, 500);

            } catch (error) {
                addDebug("❌ Erreur lors de l'initialisation: " + error.message);
                addStatus("❌ Erreur lors de l'initialisation: " + error.message, "error");
            }
        }

        // Validation du formulaire
        function validateForm() {
            addDebug("📋 === VALIDATION FORMULAIRE ===");
            
            const firstname = document.getElementById('firstname').value;
            const lastname = document.getElementById('lastname').value;
            const email = document.getElementById('email').value;
            const phone = window.getPlanityPhoneNumber ? window.getPlanityPhoneNumber() : "";
            
            addDebug(`📊 Prénom: ${firstname}`);
            addDebug(`📊 Nom: ${lastname}`);
            addDebug(`📊 Email: ${email}`);
            addDebug(`📊 Téléphone: ${phone}`);
            
            const isValid = firstname && lastname && phone && phone.length > 10;
            
            if (isValid) {
                addStatus("✅ Formulaire valide", "success");
            } else {
                addStatus("❌ Formulaire invalide", "error");
            }
            
            return isValid;
        }

        // Gestion du submit
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            addDebug("📤 === SUBMIT FORMULAIRE ===");
            
            if (validateForm()) {
                addStatus("✅ Formulaire soumis avec succès", "success");
            } else {
                addStatus("❌ Formulaire invalide", "error");
            }
        });

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            addDebug("📄 Page chargée, début de l'initialisation");
            initSimpleCountrySelector();
        });
    </script>
</body>
</html>
