<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Final - Correction Téléphone</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
      .form-group {
        margin: 20px 0;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #374151;
      }
      .phone-container {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }
      .debug-info {
        background: #f0f0f0;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-family: monospace;
        font-size: 12px;
        max-height: 400px;
        overflow-y: auto;
      }
      .submit-btn {
        padding: 12px 24px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
      }
      .submit-btn:disabled {
        background: #6c757d;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>🎯 Test Final - Correction Téléphone</h1>

      <div id="status-container"></div>

      <form id="test-form">
        <div class="form-group">
          <label for="firstname">Prénom</label>
          <input type="text" id="firstname" name="firstname" value="sissi" />
        </div>

        <div class="form-group">
          <label for="lastname">Nom</label>
          <input type="text" id="lastname" name="lastname" value="had" />
        </div>

        <div class="form-group">
          <label for="email">Email (optionnel)</label>
          <input
            type="email"
            id="email"
            name="email"
            value="melissa@gmail.com"
          />
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <div
            id="simple-country-selector-container"
            class="phone-container"
          ></div>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="privacy" checked />
            J'ai lu et j'accepte la politique de confidentialité
          </label>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn" disabled>
          Valider la réservation
        </button>
      </form>

      <div class="debug-info" id="debug-info">
        <strong>Debug Info:</strong><br />
        Test final de correction téléphone...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="testPhoneCapture()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          📞 Tester Capture
        </button>
        <button
          onclick="testValidation()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          ✅ Tester Validation
        </button>
        <button
          onclick="forceInit()"
          style="
            padding: 10px;
            margin: 5px;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
          "
        >
          🔄 Forcer Init
        </button>
        <button
          onclick="simulateWordPress()"
          style="
            padding: 10px;
            margin: 5px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🌐 Simuler WordPress
        </button>
      </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      // Simulation de l'environnement WordPress
      window.ajaxurl = "test-ajax-url";
      window.ib_nonce = "test-nonce";
      window.bookingState = {
        client: {},
        selectedService: { id: 1, name: "Test Service" },
        selectedEmployee: { id: 1, name: "Test Employee" },
        selectedDate: "2025-01-15",
        selectedSlot: "10:00",
      };

      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message) {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();
        debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      // Simulation des fonctions de validation WordPress
      function isValidName(str) {
        return /^[a-zA-ZÀ-ÿ\s'-]{2,50}$/.test(str.trim());
      }

      function isValidEmail(str) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str.trim());
      }

      function isValidPhoneNumber(str) {
        return /^[0-9\s\-\(\)]{8,15}$/.test(str.trim());
      }

      function showError(input, message) {
        if (input) {
          input.style.borderColor = "#dc3545";
        }
        addDebug(`❌ Erreur: ${message}`);
      }

      function clearError(input) {
        if (input) {
          input.style.borderColor = "#d1d5db";
        }
      }

      function setupWordPressValidation() {
        const form = document.getElementById("test-form");
        const firstnameInput = form.querySelector("#firstname");
        const lastnameInput = form.querySelector("#lastname");
        const emailInput = form.querySelector("#email");
        const submitBtn = document.getElementById("submit-btn");

        const touched = {
          firstname: false,
          lastname: false,
          email: false,
          phone: false,
        };

        function validateField(input, type) {
          let valid = true;
          let value = input ? input.value : "";

          if (type === "firstname" || type === "lastname") {
            valid = isValidName(value);
          } else if (type === "email") {
            if (value.trim() === "") {
              valid = true;
            } else {
              valid = isValidEmail(value);
            }
          } else if (type === "phone") {
            // Utiliser le sélecteur custom Planity si disponible
            let validIntl = false;
            let validCustom = false;
            let country = "";
            let fullPhoneNumber = "";
            let phoneValue = "";

            // Forcer l'initialisation si le sélecteur n'est pas prêt
            if (!window.simpleCountrySelector && window.SimpleCountrySelector) {
              addDebug(
                "🔧 [Fix] Sélecteur non initialisé, initialisation forcée..."
              );
              const container = document.getElementById(
                "simple-country-selector-container"
              );
              if (container) {
                window.simpleCountrySelector = new SimpleCountrySelector(
                  container,
                  {
                    defaultCountry: "DZ",
                    placeholder: "Numéro de téléphone",
                  }
                );
              }
            }

            // Récupérer la valeur du champ téléphone depuis le sélecteur personnalisé
            if (window.simpleCountrySelector) {
              const phoneInput =
                window.simpleCountrySelector.container.querySelector(
                  ".simple-phone-input"
                );
              if (phoneInput) {
                phoneValue = phoneInput.value;
              }
            } else if (input) {
              phoneValue = input.value;
            }

            // Vérifier que les fonctions globales sont disponibles
            if (window.getPlanityCountryCode && window.getPlanityPhoneNumber) {
              // Sélecteur custom Planity
              country = window.getPlanityCountryCode().replace("+", "");
              fullPhoneNumber = window.getPlanityPhoneNumber();
              validIntl = fullPhoneNumber.length >= 10; // Validation basique avec code pays
              validCustom = isValidPhoneNumber(phoneValue); // Validation du champ local
            } else if (window.iti && window.iti.isValidNumber) {
              // Fallback intl-tel-input
              validIntl = window.iti.isValidNumber();
              country = window.iti.getSelectedCountryData
                ? window.iti.getSelectedCountryData().dialCode
                : "";
              fullPhoneNumber = window.iti.getNumber();
            }

            addDebug(
              `[PHONE VALIDATION] {value: '${phoneValue}', fullPhoneNumber: '${fullPhoneNumber}', country: '${country}', validIntl: ${validIntl}, validCustom: ${validCustom}, usingPlanity: ${!!window.getPlanityCountryCode}, selectorExists: ${!!window.simpleCountrySelector}}`
            );

            valid = validIntl && validCustom;
            if (!valid && touched.phone) {
              showError(
                input ||
                  window.simpleCountrySelector?.container.querySelector(
                    ".simple-phone-input"
                  ),
                "Numéro de téléphone invalide (format mobile, chiffres uniquement)"
              );
            } else {
              clearError(
                input ||
                  window.simpleCountrySelector?.container.querySelector(
                    ".simple-phone-input"
                  )
              );
            }
          }
          return valid;
        }

        function validateAll() {
          let valid = true;
          if (!validateField(firstnameInput, "firstname")) valid = false;
          if (!validateField(lastnameInput, "lastname")) valid = false;
          if (!validateField(emailInput, "email")) valid = false;
          if (!validateField(null, "phone")) valid = false;
          submitBtn.disabled = !valid;
          return valid;
        }

        // Gestion du "touched" et validation champ par champ
        [firstnameInput, lastnameInput, emailInput].forEach((input, index) => {
          const types = ["firstname", "lastname", "email"];
          const type = types[index];

          input.addEventListener("blur", function () {
            touched[type] = true;
            validateField(input, type);
            validateAll();
          });

          input.addEventListener("input", function () {
            if (touched[type]) {
              validateField(input, type);
              validateAll();
            }
          });
        });

        // Ajouter un écouteur pour le champ téléphone du sélecteur personnalisé
        if (window.simpleCountrySelector) {
          const customPhoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (customPhoneInput) {
            customPhoneInput.addEventListener("blur", function () {
              touched.phone = true;
              validateField(null, "phone");
              validateAll();
            });
            customPhoneInput.addEventListener("input", function () {
              if (touched.phone) {
                validateField(null, "phone");
              }
              validateAll();
            });
          }
        }

        // Validation initiale
        validateAll();
      }

      function testPhoneCapture() {
        addDebug("📞 === TEST CAPTURE NUMÉRO ===");

        if (!window.simpleCountrySelector) {
          addStatus("❌ Sélecteur non initialisé", "error");
          return;
        }

        const phoneInput = window.simpleCountrySelector.container.querySelector(
          ".simple-phone-input"
        );
        const currentValue = phoneInput.value;
        const fullNumber = window.simpleCountrySelector.getFullPhoneNumber();
        const countryCode = window.simpleCountrySelector.getCountryCode();

        addDebug(`📱 Valeur champ: "${currentValue}"`);
        addDebug(`🌍 Code pays: "${countryCode}"`);
        addDebug(`📞 Numéro complet: "${fullNumber}"`);

        if (fullNumber && fullNumber.length >= 10) {
          addStatus("✅ Numéro capturé correctement", "success");
        } else {
          addStatus("❌ Problème de capture du numéro", "error");
        }
      }

      function testValidation() {
        addDebug("✅ === TEST VALIDATION ===");

        const form = document.getElementById("test-form");
        const firstname = form.querySelector("#firstname").value;
        const lastname = form.querySelector("#lastname").value;
        const email = form.querySelector("#email").value;

        let valid = true;

        // Test validation noms
        if (!isValidName(firstname)) {
          addDebug("❌ Prénom invalide");
          valid = false;
        } else {
          addDebug("✅ Prénom valide");
        }

        if (!isValidName(lastname)) {
          addDebug("❌ Nom invalide");
          valid = false;
        } else {
          addDebug("✅ Nom valide");
        }

        // Test validation email
        if (email.trim() === "" || isValidEmail(email)) {
          addDebug("✅ Email valide (ou vide)");
        } else {
          addDebug("❌ Email invalide");
          valid = false;
        }

        // Test validation téléphone
        if (window.getPlanityPhoneNumber) {
          const fullPhone = window.getPlanityPhoneNumber();
          if (fullPhone && fullPhone.length >= 10) {
            addDebug("✅ Téléphone valide");
          } else {
            addDebug("❌ Téléphone invalide");
            valid = false;
          }
        } else {
          addDebug("❌ Fonctions téléphone non disponibles");
          valid = false;
        }

        if (valid) {
          addStatus("✅ Validation complète réussie", "success");
        } else {
          addStatus("❌ Validation échouée", "error");
        }
      }

      function forceInit() {
        addDebug("🔄 === FORCER INITIALISATION ===");

        // Supprimer l'ancienne instance
        if (window.simpleCountrySelector) {
          addDebug("🗑️ Suppression de l'ancienne instance");
          delete window.simpleCountrySelector;
        }

        // Recréer l'instance
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        if (container && window.SimpleCountrySelector) {
          addDebug("🔄 Création d'une nouvelle instance");
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "DZ",
            placeholder: "Numéro de téléphone",
          });
          addDebug("✅ Nouvelle instance créée");

          // Saisir un numéro de test
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneInput.value = "558769610";
            addDebug("📱 Numéro de test saisi: 558769610");
          }

          // Configurer la validation
          setTimeout(() => {
            setupWordPressValidation();
            addDebug("✅ Validation configurée");
          }, 100);
        } else {
          addDebug("❌ Impossible de recréer l'instance");
        }
      }

      function simulateWordPress() {
        addDebug("🌐 === SIMULATION WORDPRESS ===");

        // Simuler le comportement WordPress
        addDebug("🌐 Simulation de l'environnement WordPress...");

        // Forcer l'initialisation avec délai
        setTimeout(() => {
          forceInit();
        }, 100);

        // Simuler la validation après un délai
        setTimeout(() => {
          testPhoneCapture();
          testValidation();
        }, 1000);
      }

      // Initialisation
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("🎯 Page chargée, test final téléphone");

        // Initialiser le sélecteur
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        if (container && window.SimpleCountrySelector) {
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "DZ",
            placeholder: "Numéro de téléphone",
          });
          addDebug("✅ Sélecteur initialisé avec DZ par défaut");

          // Saisir un numéro de test
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneInput.value = "558769610";
            addDebug("📱 Numéro de test saisi: 558769610");
          }

          // Configurer la validation
          setTimeout(() => {
            setupWordPressValidation();
            addDebug("✅ Validation configurée");
          }, 100);
        } else {
          addDebug("❌ Impossible d'initialiser le sélecteur");
        }
      });
    </script>
  </body>
</html>
