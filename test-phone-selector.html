<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Sélecteur Téléphone Planity</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 0 auto;
      }
      .test-section {
        margin: 30px 0;
        padding: 20px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .test-title {
        color: #374151;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
      }
      .phone-field-modern {
        margin-bottom: 1.5em;
      }
      .phone-field-modern label {
        color: #606060 !important;
        font-size: 1.04em;
        margin-bottom: 0.4em;
        display: block;
      }
      .debug-info {
        background: #f3f4f6;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        font-family: monospace;
        font-size: 12px;
        max-height: 200px;
        overflow-y: auto;
      }
      .status-indicator {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: bold;
      }
      .status-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .status-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
      .status-info {
        background: #dbeafe;
        color: #1e40af;
        border: 1px solid #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>📞 Test Sélecteur Téléphone Planity</h1>
      <p>Test du sélecteur de téléphone custom avec palette noir/gris/blanc</p>

      <div class="status-indicator status-info">
        <strong>État :</strong> Test en cours...
      </div>

      <div class="test-section">
        <div class="test-title">Test Desktop</div>
        <div class="phone-field-modern">
          <label for="client-phone">Téléphone</label>
          <input
            id="client-phone"
            type="tel"
            required
            value=""
            placeholder="Numéro de téléphone"
            style="color: #606060 !important"
          />
        </div>
      </div>

      <div class="test-section">
        <div class="test-title">Test Mobile</div>
        <div class="phone-field-modern">
          <label for="client-phone-mobile">Téléphone Mobile</label>
          <input
            id="client-phone-mobile"
            type="tel"
            required
            value=""
            placeholder="Numéro de téléphone"
            style="color: #606060 !important"
          />
        </div>
      </div>

      <div class="test-section">
        <div class="test-title">Fonctions Globales</div>
        <button
          onclick="testGetPhoneNumber()"
          style="
            background: #374151;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
          "
        >
          Test getPlanityPhoneNumber()
        </button>
        <button
          onclick="testGetCountryCode()"
          style="
            background: #374151;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
          "
        >
          Test getPlanityCountryCode()
        </button>
        <button
          onclick="testGetPhoneOnly()"
          style="
            background: #374151;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
          "
        >
          Test getPlanityPhoneNumberOnly()
        </button>
      </div>

      <div class="debug-info">
        <h3>Debug Info:</h3>
        <div id="debug-info"></div>
      </div>
    </div>

    <script>
      function addDebugInfo(message) {
        const debugDiv = document.getElementById("debug-info");
        const time = new Date().toLocaleTimeString();
        debugDiv.innerHTML += `<div>[${time}] ${message}</div>`;
        debugDiv.scrollTop = debugDiv.scrollHeight;
      }

      function updateStatus(message, type = "info") {
        const statusDiv = document.querySelector(".status-indicator");
        statusDiv.className = `status-indicator status-${type}`;
        statusDiv.innerHTML = `<strong>État :</strong> ${message}`;
      }

      function testGetPhoneNumber() {
        if (window.getPlanityPhoneNumber) {
          const phone = window.getPlanityPhoneNumber();
          addDebugInfo(`📞 getPlanityPhoneNumber(): ${phone}`);
          updateStatus(`Numéro complet: ${phone}`, "success");
        } else {
          addDebugInfo("❌ getPlanityPhoneNumber() non disponible");
          updateStatus("Fonction getPlanityPhoneNumber() non trouvée", "error");
        }
      }

      function testGetCountryCode() {
        if (window.getPlanityCountryCode) {
          const code = window.getPlanityCountryCode();
          addDebugInfo(`🌍 getPlanityCountryCode(): ${code}`);
          updateStatus(`Code pays: ${code}`, "success");
        } else {
          addDebugInfo("❌ getPlanityCountryCode() non disponible");
          updateStatus("Fonction getPlanityCountryCode() non trouvée", "error");
        }
      }

      function testGetPhoneOnly() {
        if (window.getPlanityPhoneNumberOnly) {
          const phone = window.getPlanityPhoneNumberOnly();
          addDebugInfo(`📱 getPlanityPhoneNumberOnly(): ${phone}`);
          updateStatus(`Numéro seul: ${phone}`, "success");
        } else {
          addDebugInfo("❌ getPlanityPhoneNumberOnly() non disponible");
          updateStatus(
            "Fonction getPlanityPhoneNumberOnly() non trouvée",
            "error"
          );
        }
      }

      // Initialisation
      addDebugInfo("🚀 Initialisation du test");
      updateStatus("Chargement du sélecteur Planity...", "info");

      // Attendre que le DOM soit chargé
      document.addEventListener("DOMContentLoaded", function () {
        addDebugInfo("✅ DOM chargé");

        // Vérifier si le script Planity est chargé
        setTimeout(() => {
          if (window.getPlanityPhoneNumber) {
            addDebugInfo("✅ Script Planity détecté");
            updateStatus("Sélecteur Planity actif", "success");
          } else {
            addDebugInfo("❌ Script Planity non détecté");
            updateStatus("Script Planity non trouvé", "error");
          }
        }, 1000);

        // Vérifier les éléments créés
        setTimeout(() => {
          const planityContainers = document.querySelectorAll(
            ".planity-phone-container"
          );
          addDebugInfo(
            `🔍 Containers Planity trouvés: ${planityContainers.length}`
          );

          if (planityContainers.length > 0) {
            updateStatus(
              `${planityContainers.length} sélecteur(s) créé(s)`,
              "success"
            );
          } else {
            updateStatus("Aucun sélecteur créé", "error");
          }
        }, 2000);
      });
    </script>

    <!-- Charger le script Planity -->
    <script src="assets/js/planity-phone-selector.js"></script>
  </body>
</html>
