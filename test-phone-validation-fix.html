<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Validation Téléphone - Correction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: 500;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.warning { background: #fff3cd; color: #856404; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .form-group {
            margin: 20px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        .phone-container {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            overflow: hidden;
        }
        .debug-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📞 Test Validation Téléphone - Correction</h1>
        
        <div id="status-container"></div>
        
        <form id="test-form">
            <div class="form-group">
                <label for="firstname">Prénom</label>
                <input type="text" id="firstname" name="firstname" value="Mimi">
            </div>
            
            <div class="form-group">
                <label for="lastname">Nom</label>
                <input type="text" id="lastname" name="lastname" value="Test">
            </div>
            
            <div class="form-group">
                <label for="email">Email (optionnel)</label>
                <input type="email" id="email" name="email" value="melissa@gmail.com">
            </div>
            
            <div class="form-group">
                <label>Téléphone</label>
                <div id="simple-country-selector-container" class="phone-container"></div>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="privacy" checked>
                    J'ai lu et j'accepte la politique de confidentialité
                </label>
            </div>
            
            <button type="submit" id="submit-btn" disabled>Valider la réservation</button>
        </form>
        
        <div class="debug-info" id="debug-info">
            <strong>Debug Info:</strong><br>
            Test de validation téléphone...
        </div>
        
        <div style="margin-top: 20px;">
            <button onclick="testPhoneCapture()" style="padding: 10px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px;">
                📞 Tester Capture Numéro
            </button>
            <button onclick="testValidation()" style="padding: 10px; margin: 5px; background: #28a745; color: white; border: none; border-radius: 4px;">
                ✅ Tester Validation
            </button>
            <button onclick="testGlobalFunctions()" style="padding: 10px; margin: 5px; background: #ffc107; color: black; border: none; border-radius: 4px;">
                🌍 Tester Fonctions Globales
            </button>
            <button onclick="clearPhone()" style="padding: 10px; margin: 5px; background: #dc3545; color: white; border: none; border-radius: 4px;">
                🗑️ Vider Téléphone
            </button>
        </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
        function addStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            container.appendChild(statusDiv);
        }

        function addDebug(message) {
            const debugInfo = document.getElementById('debug-info');
            const timestamp = new Date().toLocaleTimeString();
            debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        // Simulation de la validation du formulaire
        function isValidName(str) {
            return /^[a-zA-ZÀ-ÿ\s'-]{2,50}$/.test(str.trim());
        }

        function isValidEmail(str) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str.trim());
        }

        function isValidPhoneNumber(str) {
            return /^[0-9\s\-\(\)]{8,15}$/.test(str.trim());
        }

        function setupValidation() {
            const form = document.getElementById('test-form');
            const firstnameInput = form.querySelector("#firstname");
            const lastnameInput = form.querySelector("#lastname");
            const emailInput = form.querySelector("#email");
            const submitBtn = document.getElementById('submit-btn');

            const touched = {
                firstname: false,
                lastname: false,
                email: false,
                phone: false,
            };

            function validateField(input, type) {
                let valid = true;
                let value = input.value;
                
                if (type === "firstname" || type === "lastname") {
                    valid = isValidName(value);
                } else if (type === "email") {
                    if (value.trim() === "") {
                        valid = true;
                    } else {
                        valid = isValidEmail(value);
                    }
                } else if (type === "phone") {
                    // Utiliser le sélecteur custom Planity si disponible
                    let validIntl = false;
                    let validCustom = false;
                    let country = "";
                    let fullPhoneNumber = "";

                    if (window.getPlanityCountryCode && window.getPlanityPhoneNumber) {
                        // Sélecteur custom Planity
                        country = window.getPlanityCountryCode().replace("+", "");
                        fullPhoneNumber = window.getPlanityPhoneNumber();
                        validIntl = fullPhoneNumber.length >= 10; // Validation basique avec code pays
                        validCustom = isValidPhoneNumber(value); // Validation du champ local
                    } else if (window.iti && window.iti.isValidNumber) {
                        // Fallback intl-tel-input
                        validIntl = window.iti.isValidNumber();
                        country = window.iti.getSelectedCountryData
                            ? window.iti.getSelectedCountryData().dialCode
                            : "";
                        fullPhoneNumber = window.iti.getNumber();
                    }

                    addDebug(`[PHONE VALIDATION] {value: '${value}', fullPhoneNumber: '${fullPhoneNumber}', country: '${country}', validIntl: ${validIntl}, validCustom: ${validCustom}, usingPlanity: ${!!window.getPlanityCountryCode}}`);

                    valid = validIntl && validCustom;
                }
                return valid;
            }

            function validateAll() {
                let valid = true;
                if (!validateField(firstnameInput, "firstname")) valid = false;
                if (!validateField(lastnameInput, "lastname")) valid = false;
                if (!validateField(emailInput, "email")) valid = false;
                if (!validateField(null, "phone")) valid = false;
                submitBtn.disabled = !valid;
                return valid;
            }

            // Gestion du "touched" et validation champ par champ
            [firstnameInput, lastnameInput, emailInput].forEach((input, index) => {
                const types = ["firstname", "lastname", "email"];
                const type = types[index];
                
                input.addEventListener("blur", function () {
                    touched[type] = true;
                    validateField(input, type);
                    validateAll();
                });
                
                input.addEventListener("input", function () {
                    if (touched[type]) {
                        validateField(input, type);
                        validateAll();
                    }
                });
            });

            // Validation téléphone à chaque changement
            if (window.simpleCountrySelector) {
                const phoneInput = window.simpleCountrySelector.container.querySelector('.simple-phone-input');
                if (phoneInput) {
                    phoneInput.addEventListener("input", function() {
                        touched.phone = true;
                        validateAll();
                    });
                }
            }

            // Validation initiale
            validateAll();
        }

        function testPhoneCapture() {
            addDebug("📞 === TEST CAPTURE NUMÉRO ===");
            
            if (!window.simpleCountrySelector) {
                addStatus("❌ Sélecteur non initialisé", "error");
                return;
            }

            const phoneInput = window.simpleCountrySelector.container.querySelector('.simple-phone-input');
            const currentValue = phoneInput.value;
            const fullNumber = window.simpleCountrySelector.getFullPhoneNumber();
            const countryCode = window.simpleCountrySelector.getCountryCode();
            const phoneNumber = window.simpleCountrySelector.getPhoneNumber();

            addDebug(`📱 Valeur champ: "${currentValue}"`);
            addDebug(`🌍 Code pays: "${countryCode}"`);
            addDebug(`📞 Numéro local: "${phoneNumber}"`);
            addDebug(`📞 Numéro complet: "${fullNumber}"`);

            if (fullNumber && fullNumber.length >= 10) {
                addStatus("✅ Numéro capturé correctement", "success");
            } else {
                addStatus("❌ Problème de capture du numéro", "error");
            }
        }

        function testValidation() {
            addDebug("✅ === TEST VALIDATION ===");
            
            const form = document.getElementById('test-form');
            const firstname = form.querySelector("#firstname").value;
            const lastname = form.querySelector("#lastname").value;
            const email = form.querySelector("#email").value;
            
            let valid = true;
            
            // Test validation noms
            if (!isValidName(firstname)) {
                addDebug("❌ Prénom invalide");
                valid = false;
            } else {
                addDebug("✅ Prénom valide");
            }
            
            if (!isValidName(lastname)) {
                addDebug("❌ Nom invalide");
                valid = false;
            } else {
                addDebug("✅ Nom valide");
            }
            
            // Test validation email
            if (email.trim() === "" || isValidEmail(email)) {
                addDebug("✅ Email valide (ou vide)");
            } else {
                addDebug("❌ Email invalide");
                valid = false;
            }
            
            // Test validation téléphone
            if (window.getPlanityPhoneNumber) {
                const fullPhone = window.getPlanityPhoneNumber();
                if (fullPhone && fullPhone.length >= 10) {
                    addDebug("✅ Téléphone valide");
                } else {
                    addDebug("❌ Téléphone invalide");
                    valid = false;
                }
            } else {
                addDebug("❌ Fonctions téléphone non disponibles");
                valid = false;
            }
            
            if (valid) {
                addStatus("✅ Validation complète réussie", "success");
            } else {
                addStatus("❌ Validation échouée", "error");
            }
        }

        function testGlobalFunctions() {
            addDebug("🌍 === TEST FONCTIONS GLOBALES ===");
            
            if (window.getPlanityCountryCode) {
                const countryCode = window.getPlanityCountryCode();
                addDebug(`🌍 Code pays: "${countryCode}"`);
            } else {
                addDebug("❌ getPlanityCountryCode non disponible");
            }
            
            if (window.getPlanityPhoneNumber) {
                const phoneNumber = window.getPlanityPhoneNumber();
                addDebug(`📞 Numéro complet: "${phoneNumber}"`);
            } else {
                addDebug("❌ getPlanityPhoneNumber non disponible");
            }
            
            if (window.simpleCountrySelector) {
                addDebug("✅ Sélecteur initialisé");
                addDebug(`🌍 Pays sélectionné: ${window.simpleCountrySelector.selectedCountry.name}`);
            } else {
                addDebug("❌ Sélecteur non initialisé");
            }
        }

        function clearPhone() {
            addDebug("🗑️ === VIDAGE TÉLÉPHONE ===");
            
            if (window.simpleCountrySelector) {
                const phoneInput = window.simpleCountrySelector.container.querySelector('.simple-phone-input');
                if (phoneInput) {
                    phoneInput.value = "";
                    addDebug("🗑️ Champ téléphone vidé");
                    addStatus("✅ Téléphone vidé", "success");
                }
            }
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            addDebug("📞 Page chargée, initialisation...");
            
            // Initialiser le sélecteur
            const container = document.getElementById('simple-country-selector-container');
            if (container) {
                window.simpleCountrySelector = new SimpleCountrySelector(container, {
                    defaultCountry: "DZ",
                    placeholder: "Numéro de téléphone"
                });
                addDebug("✅ Sélecteur initialisé avec DZ par défaut");
                
                // Saisir un numéro de test
                const phoneInput = window.simpleCountrySelector.container.querySelector('.simple-phone-input');
                if (phoneInput) {
                    phoneInput.value = "558769610";
                    addDebug("📱 Numéro de test saisi: 558769610");
                }
                
                // Configurer la validation
                setTimeout(() => {
                    setupValidation();
                    addDebug("✅ Validation configurée");
                    testPhoneCapture();
                }, 100);
            } else {
                addDebug("❌ Container non trouvé");
            }
        });
    </script>
</body>
</html>
