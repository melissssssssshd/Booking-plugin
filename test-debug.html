<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Debug - Barre de Progression</title>
    <link rel="stylesheet" href="assets/css/booking-form.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 2rem;
        }
        .debug-panel {
            background: white;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-controls {
            text-align: center;
            margin: 2rem 0;
        }
        .test-controls button {
            background: #1f2937;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 0 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .test-controls button:hover {
            background: #374151;
        }
        .test-controls button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="debug-panel">
        <h3>Debug - État de la barre de progression</h3>
        <p><strong>Étape actuelle:</strong> <span id="currentStep">1</span></p>
        <p><strong>Éléments trouvés:</strong> <span id="elementsFound">-</span></p>
        <p><strong>Largeur barre:</strong> <span id="progressWidth">-</span></p>
    </div>

    <!-- Barre de progression Planity -->
    <div class="planity-progress-bar">
        <div class="progress-container">
            <div class="ib-stepper-main">
                <div class="ib-step active" data-step="1">
                    <div class="ib-step-circle">1</div>
                    <div class="ib-step-label">Service</div>
                </div>
                <div class="ib-step" data-step="2">
                    <div class="ib-step-circle">2</div>
                    <div class="ib-step-label">Praticienne</div>
                </div>
                <div class="ib-step" data-step="3">
                    <div class="ib-step-circle">3</div>
                    <div class="ib-step-label">Date & Heure</div>
                </div>
                <div class="ib-step" data-step="4">
                    <div class="ib-step-circle">4</div>
                    <div class="ib-step-label">Informations</div>
                </div>
                <div class="ib-step" data-step="5">
                    <div class="ib-step-circle">5</div>
                    <div class="ib-step-label">Confirmation</div>
                </div>
                <div class="ib-stepper-progress"></div>
            </div>
        </div>
    </div>

    <div class="test-controls">
        <button onclick="setStep(1)" id="step1Btn">Étape 1</button>
        <button onclick="setStep(2)" id="step2Btn">Étape 2</button>
        <button onclick="setStep(3)" id="step3Btn">Étape 3</button>
        <button onclick="setStep(4)" id="step4Btn">Étape 4</button>
        <button onclick="setStep(5)" id="step5Btn">Étape 5</button>
    </div>

    <div class="debug-panel">
        <h4>Console de debug</h4>
        <div id="debugConsole" style="background: #f8f9fa; padding: 1rem; border-radius: 4px; font-family: monospace; font-size: 0.9rem; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <script>
        // Initialisation de l'état
        window.bookingState = { step: 1 };

        // Fonction de debug pour afficher les logs
        function debugLog(message) {
            const console = document.getElementById('debugConsole');
            const time = new Date().toLocaleTimeString();
            console.innerHTML += `[${time}] ${message}<br>`;
            console.scrollTop = console.scrollHeight;
        }

        // Fonction pour mettre à jour la barre de progression (copie de celle du plugin)
        function updateProgressBar() {
            const steps = document.querySelectorAll(".ib-stepper-main .ib-step");
            const progressBar = document.querySelector(".ib-stepper-main .ib-stepper-progress");

            debugLog(`updateProgressBar called - Current step: ${window.bookingState.step}`);
            debugLog(`Found steps: ${steps.length}`);
            debugLog(`Found progress bar: ${!!progressBar}`);

            // Mettre à jour l'affichage debug
            document.getElementById('currentStep').textContent = window.bookingState.step;
            document.getElementById('elementsFound').textContent = `${steps.length} étapes, ${progressBar ? 'barre OK' : 'barre manquante'}`;

            steps.forEach((step, index) => {
                const stepNumber = index + 1;
                const circle = step.querySelector(".ib-step-circle");
                
                step.classList.remove("active", "completed");

                if (stepNumber < window.bookingState.step) {
                    step.classList.add("completed");
                    if (circle) {
                        circle.textContent = "✓";
                    }
                } else if (stepNumber === window.bookingState.step) {
                    step.classList.add("active");
                    if (circle) {
                        circle.textContent = stepNumber;
                    }
                } else {
                    if (circle) {
                        circle.textContent = stepNumber;
                    }
                }
            });

            // Mettre à jour la largeur de la barre de progression
            if (progressBar && steps.length > 0) {
                const currentStep = window.bookingState.step;
                const totalSteps = steps.length;
                
                let progressWidth = 0;
                if (currentStep > 1) {
                    progressWidth = ((currentStep - 1) / (totalSteps - 1)) * 100;
                }
                
                debugLog(`Progress calculation: step ${currentStep}/${totalSteps} = ${progressWidth}%`);
                progressBar.style.width = Math.max(0, Math.min(100, progressWidth)) + "%";
                
                document.getElementById('progressWidth').textContent = progressWidth + "%";
            }
        }

        function setStep(step) {
            debugLog(`Setting step to: ${step}`);
            window.bookingState.step = step;
            updateProgressBar();
        }

        // Initialisation
        debugLog("Page loaded, initializing...");
        updateProgressBar();
    </script>
</body>
</html>
