<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Progress Bar - Fix Final</title>
    <link rel="stylesheet" href="assets/css/booking-form.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .test-controls {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        .test-controls button {
            margin: 0 10px;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .test-controls button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .test-controls button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #1f2937;
            color: #e5e7eb;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-ok { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-warning { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Test Progress Bar - Fix Final</h1>
        
        <div style="margin-bottom: 20px;">
            <p><span class="status-indicator status-warning"></span><strong>État:</strong> <span id="currentStatus">Test en cours...</span></p>
            <p><span class="status-indicator" id="jsIndicator"></span><strong>JavaScript:</strong> <span id="jsStatus">Vérification...</span></p>
            <p><span class="status-indicator" id="progressIndicator"></span><strong>Progress Bar:</strong> <span id="progressStatus">Vérification...</span></p>
        </div>

        <!-- Barre de progression Planity -->
        <div class="planity-progress-bar">
            <div class="progress-container">
                <div class="ib-stepper-main">
                    <div class="ib-step active" data-step="1">
                        <div class="ib-step-circle">1</div>
                        <div class="ib-step-label">Service</div>
                    </div>
                    <div class="ib-step" data-step="2">
                        <div class="ib-step-circle">2</div>
                        <div class="ib-step-label">Praticienne</div>
                    </div>
                    <div class="ib-step" data-step="3">
                        <div class="ib-step-circle">3</div>
                        <div class="ib-step-label">Date & Heure</div>
                    </div>
                    <div class="ib-step" data-step="4">
                        <div class="ib-step-circle">4</div>
                        <div class="ib-step-label">Informations</div>
                    </div>
                    <div class="ib-step" data-step="5">
                        <div class="ib-step-circle">5</div>
                        <div class="ib-step-label">Confirmation</div>
                    </div>
                    <div class="ib-stepper-progress"></div>
                </div>
            </div>
        </div>

        <div class="test-controls">
            <button onclick="prevStep()" id="prevBtn">← Étape précédente</button>
            <button onclick="nextStep()" id="nextBtn">Étape suivante →</button>
            <button onclick="resetSteps()">🔄 Reset</button>
            <button onclick="testAllSteps()">🧪 Test Auto</button>
        </div>

        <div style="text-align: center; padding: 20px; background: #f8fafc; border-radius: 8px;">
            <h3 id="stepTitle">Étape 1: Service</h3>
            <p><strong>Étape actuelle:</strong> <span id="currentStep">1</span>/5</p>
            <p><strong>Largeur barre:</strong> <span id="progressWidth">0%</span></p>
        </div>

        <div class="debug-info" id="debugInfo">Initialisation...</div>
    </div>

    <script src="assets/js/progress-bar-simple.js"></script>
    <script>
        const stepTitles = [
            "Étape 1: Service",
            "Étape 2: Praticienne", 
            "Étape 3: Date & Heure",
            "Étape 4: Informations",
            "Étape 5: Confirmation"
        ];

        let debugLog = [];

        function addDebugInfo(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugLog.push(`[${timestamp}] ${message}`);
            if (debugLog.length > 10) debugLog.shift();
            document.getElementById('debugInfo').textContent = debugLog.join('\n');
        }

        function updateStatus() {
            const currentStep = window.bookingState?.step || 1;
            const progressBar = document.querySelector('.ib-stepper-progress');
            
            document.getElementById('stepTitle').textContent = stepTitles[currentStep - 1];
            document.getElementById('currentStep').textContent = currentStep;
            
            if (progressBar) {
                const width = progressBar.style.width || '0px';
                document.getElementById('progressWidth').textContent = width;
                
                // Vérifier si la barre progresse
                const widthValue = parseFloat(width);
                if (widthValue > 0) {
                    document.getElementById('progressIndicator').className = 'status-indicator status-ok';
                    document.getElementById('progressStatus').textContent = 'Fonctionne ✓';
                } else if (currentStep > 1) {
                    document.getElementById('progressIndicator').className = 'status-indicator status-error';
                    document.getElementById('progressStatus').textContent = 'Problème détecté ✗';
                } else {
                    document.getElementById('progressIndicator').className = 'status-indicator status-warning';
                    document.getElementById('progressStatus').textContent = 'En attente...';
                }
            }

            document.getElementById('prevBtn').disabled = currentStep <= 1;
            document.getElementById('nextBtn').disabled = currentStep >= 5;
        }

        function nextStep() {
            const currentStep = window.bookingState?.step || 1;
            if (currentStep < 5) {
                addDebugInfo(`Passage à l'étape ${currentStep + 1}`);
                window.setStep(currentStep + 1);
                updateStatus();
            }
        }

        function prevStep() {
            const currentStep = window.bookingState?.step || 1;
            if (currentStep > 1) {
                addDebugInfo(`Retour à l'étape ${currentStep - 1}`);
                window.setStep(currentStep - 1);
                updateStatus();
            }
        }

        function resetSteps() {
            addDebugInfo('Reset vers étape 1');
            window.setStep(1);
            updateStatus();
        }

        function testAllSteps() {
            addDebugInfo('Test automatique démarré');
            let step = 1;
            const interval = setInterval(() => {
                window.setStep(step);
                updateStatus();
                addDebugInfo(`Test auto: étape ${step}`);
                step++;
                if (step > 5) {
                    clearInterval(interval);
                    addDebugInfo('Test automatique terminé');
                    setTimeout(() => {
                        resetSteps();
                        addDebugInfo('Reset automatique après test');
                    }, 1000);
                }
            }, 1000);
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            // Vérifier JavaScript
            if (typeof window.updateProgressBar === 'function') {
                document.getElementById('jsIndicator').className = 'status-indicator status-ok';
                document.getElementById('jsStatus').textContent = 'Chargé ✓';
            } else {
                document.getElementById('jsIndicator').className = 'status-indicator status-error';
                document.getElementById('jsStatus').textContent = 'Erreur ✗';
            }

            addDebugInfo('Page initialisée');
            updateStatus();
        });
    </script>
</body>
</html>
