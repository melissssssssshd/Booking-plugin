<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Template Réel</title>
    <link rel="stylesheet" href="assets/css/booking-form.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- Chargement du template réel -->
    <div id="booking-form-container"></div>

    <script>
        // Simulation des variables globales WordPress
        window.ajaxurl = '';
        window.bookingServices = [];
        window.bookingEmployees = [];

        // Charger le template HTML
        fetch('templates/booking-form.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('booking-form-container').innerHTML = html;
                
                // Charger le JavaScript après que le HTML soit inséré
                const script = document.createElement('script');
                script.src = 'assets/js/booking-form.js';
                document.head.appendChild(script);
            })
            .catch(error => {
                console.error('Erreur lors du chargement du template:', error);
                document.getElementById('booking-form-container').innerHTML = 
                    '<p style="text-align: center; padding: 2rem; color: red;">Erreur lors du chargement du template</p>';
            });
    </script>
</body>
</html>
