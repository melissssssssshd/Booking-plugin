<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Capture Téléphone - Diagnostic</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
      .form-group {
        margin: 20px 0;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #374151;
      }
      .phone-container {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }
      .debug-info {
        background: #f0f0f0;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-family: monospace;
        font-size: 12px;
        max-height: 400px;
        overflow-y: auto;
      }
      .debug-section {
        margin: 10px 0;
        padding: 10px;
        background: #e9ecef;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>🔍 Debug Capture Téléphone - Diagnostic</h1>

      <div id="status-container"></div>

      <form id="test-form">
        <div class="form-group">
          <label>Téléphone</label>
          <div
            id="simple-country-selector-container"
            class="phone-container"
          ></div>
        </div>
      </form>

      <div class="debug-info" id="debug-info">
        <strong>Debug Info:</strong><br />
        Diagnostic de capture téléphone...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="diagnoseSelector()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🔍 Diagnostiquer Sélecteur
        </button>
        <button
          onclick="testGlobalFunctions()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🌍 Tester Fonctions Globales
        </button>
        <button
          onclick="forceReinit()"
          style="
            padding: 10px;
            margin: 5px;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
          "
        >
          🔄 Forcer Réinitialisation
        </button>
        <button
          onclick="clearDebug()"
          style="
            padding: 10px;
            margin: 5px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🗑️ Vider Debug
        </button>
      </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message, section = "") {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();

        if (section) {
          let sectionDiv = debugInfo.querySelector(
            `[data-section="${section}"]`
          );
          if (!sectionDiv) {
            sectionDiv = document.createElement("div");
            sectionDiv.className = "debug-section";
            sectionDiv.setAttribute("data-section", section);
            sectionDiv.innerHTML = `<strong>${section}:</strong><br>`;
            debugInfo.appendChild(sectionDiv);
          }
          sectionDiv.innerHTML += `[${timestamp}] ${message}<br>`;
        } else {
          debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        }

        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      function diagnoseSelector() {
        addDebug("🔍 === DIAGNOSTIC SÉLECTEUR ===", "DIAGNOSTIC");

        // Vérifier l'existence des classes
        addDebug("📋 Vérification des classes...", "DIAGNOSTIC");
        addDebug(
          `window.SimpleCountrySelector: ${typeof window.SimpleCountrySelector}`,
          "DIAGNOSTIC"
        );
        addDebug(
          `window.simpleCountrySelector: ${typeof window.simpleCountrySelector}`,
          "DIAGNOSTIC"
        );

        // Vérifier le container
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        addDebug(`Container trouvé: ${!!container}`, "DIAGNOSTIC");
        if (container) {
          addDebug(
            `Container HTML: ${container.innerHTML.substring(0, 100)}...`,
            "DIAGNOSTIC"
          );
        }

        // Vérifier les fonctions globales
        addDebug("📋 Vérification des fonctions globales...", "DIAGNOSTIC");
        addDebug(
          `window.getPlanityCountryCode: ${typeof window.getPlanityCountryCode}`,
          "DIAGNOSTIC"
        );
        addDebug(
          `window.getPlanityPhoneNumber: ${typeof window.getPlanityPhoneNumber}`,
          "DIAGNOSTIC"
        );

        // Tester les fonctions si elles existent
        if (window.getPlanityCountryCode) {
          const countryCode = window.getPlanityCountryCode();
          addDebug(`getPlanityCountryCode() = "${countryCode}"`, "DIAGNOSTIC");
        }

        if (window.getPlanityPhoneNumber) {
          const phoneNumber = window.getPlanityPhoneNumber();
          addDebug(`getPlanityPhoneNumber() = "${phoneNumber}"`, "DIAGNOSTIC");
        }

        // Vérifier l'instance du sélecteur
        if (window.simpleCountrySelector) {
          addDebug("📋 Vérification de l'instance...", "DIAGNOSTIC");
          addDebug(
            `Instance créée: ${!!window.simpleCountrySelector}`,
            "DIAGNOSTIC"
          );
          addDebug(
            `Container de l'instance: ${!!window.simpleCountrySelector
              .container}`,
            "DIAGNOSTIC"
          );

          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          addDebug(`Champ téléphone trouvé: ${!!phoneInput}`, "DIAGNOSTIC");
          if (phoneInput) {
            addDebug(`Valeur du champ: "${phoneInput.value}"`, "DIAGNOSTIC");
          }

          addDebug(
            `Pays sélectionné: ${window.simpleCountrySelector.selectedCountry.name}`,
            "DIAGNOSTIC"
          );
          addDebug(
            `Code pays: ${window.simpleCountrySelector.selectedCountry.dial}`,
            "DIAGNOSTIC"
          );
        }
      }

      function testGlobalFunctions() {
        addDebug("🌍 === TEST FONCTIONS GLOBALES ===", "FONCTIONS");

        // Test direct des fonctions
        if (window.getPlanityCountryCode) {
          const countryCode = window.getPlanityCountryCode();
          addDebug(
            `✅ getPlanityCountryCode() = "${countryCode}"`,
            "FONCTIONS"
          );
        } else {
          addDebug(`❌ getPlanityCountryCode() non disponible`, "FONCTIONS");
        }

        if (window.getPlanityPhoneNumber) {
          const phoneNumber = window.getPlanityPhoneNumber();
          addDebug(
            `✅ getPlanityPhoneNumber() = "${phoneNumber}"`,
            "FONCTIONS"
          );
        } else {
          addDebug(`❌ getPlanityPhoneNumber() non disponible`, "FONCTIONS");
        }

        // Test via l'instance
        if (window.simpleCountrySelector) {
          const directCountryCode =
            window.simpleCountrySelector.getCountryCode();
          const directPhoneNumber =
            window.simpleCountrySelector.getFullPhoneNumber();

          addDebug(
            `📱 Direct - getCountryCode() = "${directCountryCode}"`,
            "FONCTIONS"
          );
          addDebug(
            `📱 Direct - getFullPhoneNumber() = "${directPhoneNumber}"`,
            "FONCTIONS"
          );
        }
      }

      function forceReinit() {
        addDebug("🔄 === FORCER RÉINITIALISATION ===", "RÉINIT");

        // Supprimer l'ancienne instance
        if (window.simpleCountrySelector) {
          addDebug("🗑️ Suppression de l'ancienne instance", "RÉINIT");
          delete window.simpleCountrySelector;
        }

        // Recréer l'instance
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        if (container && window.SimpleCountrySelector) {
          addDebug("🔄 Création d'une nouvelle instance", "RÉINIT");
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "DZ",
            placeholder: "Numéro de téléphone",
          });
          addDebug("✅ Nouvelle instance créée", "RÉINIT");

          // Saisir un numéro de test
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneInput.value = "558769610";
            addDebug("📱 Numéro de test saisi: 558769610", "RÉINIT");
          }
        } else {
          addDebug("❌ Impossible de recréer l'instance", "RÉINIT");
        }
      }

      function clearDebug() {
        document.getElementById("debug-info").innerHTML =
          "<strong>Debug Info:</strong><br>Debug vidé...";
      }

      // Initialisation
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("🔍 Page chargée, diagnostic téléphone", "INIT");

        // Initialiser le sélecteur
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        if (container && window.SimpleCountrySelector) {
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "DZ",
            placeholder: "Numéro de téléphone",
          });
          addDebug("✅ Sélecteur initialisé", "INIT");

          // Saisir un numéro de test
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneInput.value = "558769610";
            addDebug("📱 Numéro de test saisi: 558769610", "INIT");
          }

          // Diagnostic automatique après 1 seconde
          setTimeout(() => {
            diagnoseSelector();
            testGlobalFunctions();
          }, 1000);
        } else {
          addDebug("❌ Impossible d'initialiser le sélecteur", "INIT");
        }
      });
    </script>
  </body>
</html>
