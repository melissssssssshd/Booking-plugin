<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Visibilité Sélecteur - Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .debug-panel {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }
        .phone-field-with-country {
            position: relative;
            z-index: 1000;
            border: 2px solid red;
            padding: 10px;
            margin: 10px 0;
        }
        #simple-country-selector-container {
            border: 2px solid blue;
            padding: 5px;
            margin: 5px 0;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: 500;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.warning { background: #fff3cd; color: #856404; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        
        /* Styles pour forcer la visibilité */
        .force-visible {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative !important;
            z-index: 9999 !important;
            background: yellow !important;
            border: 3px solid green !important;
            min-height: 50px !important;
            width: 100% !important;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔍 Test Visibilité Sélecteur - Debug</h1>
        
        <div id="status-container"></div>
        
        <div class="form-group">
            <label for="phone">Téléphone (avec bordures de debug)</label>
            <div class="phone-field-with-country">
                <div id="simple-country-selector-container"></div>
                <input id="client-phone" type="hidden" value="">
            </div>
        </div>
        
        <div class="debug-panel" id="debug-panel">
            <strong>Debug Panel:</strong><br>
            Initialisation...
        </div>
        
        <div class="debug-panel" id="css-debug">
            <strong>CSS Debug:</strong><br>
            En attente...
        </div>
        
        <button onclick="forceVisibility()" style="padding: 10px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 4px;">
            🔧 Forcer Visibilité
        </button>
        
        <button onclick="checkVisibility()" style="padding: 10px; margin: 10px; background: #28a745; color: white; border: none; border-radius: 4px;">
            👁️ Vérifier Visibilité
        </button>
        
        <button onclick="resetTest()" style="padding: 10px; margin: 10px; background: #dc3545; color: white; border: none; border-radius: 4px;">
            🔄 Reset Test
        </button>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
        function addStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            container.appendChild(statusDiv);
        }

        function addDebug(message) {
            const debugPanel = document.getElementById('debug-panel');
            const timestamp = new Date().toLocaleTimeString();
            debugPanel.innerHTML += `<br>[${timestamp}] ${message}`;
            debugPanel.scrollTop = debugPanel.scrollHeight;
        }

        function addCSSDebug(message) {
            const cssDebug = document.getElementById('css-debug');
            const timestamp = new Date().toLocaleTimeString();
            cssDebug.innerHTML += `<br>[${timestamp}] ${message}`;
            cssDebug.scrollTop = cssDebug.scrollHeight;
        }

        function checkVisibility() {
            addDebug("🔍 === VÉRIFICATION VISIBILITÉ ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            if (!container) {
                addDebug("❌ Container non trouvé");
                return;
            }
            
            const rect = container.getBoundingClientRect();
            const computedStyle = window.getComputedStyle(container);
            
            addDebug(`📏 Container - Dimensions: ${rect.width}x${rect.height}`);
            addDebug(`📍 Container - Position: ${rect.top},${rect.left}`);
            addDebug(`👁️ Container - Display: ${computedStyle.display}`);
            addDebug(`👁️ Container - Visibility: ${computedStyle.visibility}`);
            addDebug(`👁️ Container - Opacity: ${computedStyle.opacity}`);
            addDebug(`👁️ Container - Z-index: ${computedStyle.zIndex}`);
            addDebug(`👁️ Container - Position: ${computedStyle.position}`);
            
            const phoneContainer = container.querySelector(".simple-phone-container");
            if (phoneContainer) {
                const phoneRect = phoneContainer.getBoundingClientRect();
                const phoneStyle = window.getComputedStyle(phoneContainer);
                
                addDebug(`📱 Phone Container - Dimensions: ${phoneRect.width}x${phoneRect.height}`);
                addDebug(`📱 Phone Container - Display: ${phoneStyle.display}`);
                addDebug(`📱 Phone Container - Visibility: ${phoneStyle.visibility}`);
                addDebug(`📱 Phone Container - Opacity: ${phoneStyle.opacity}`);
                addDebug(`📱 Phone Container - Z-index: ${phoneStyle.zIndex}`);
                
                const isVisible = phoneRect.width > 0 && phoneRect.height > 0;
                addDebug(`✅ Phone Container visible: ${isVisible}`);
            } else {
                addDebug("❌ Phone Container non trouvé");
            }
            
            // Vérifier les parents
            let parent = container.parentElement;
            let level = 1;
            while (parent && level <= 5) {
                const parentStyle = window.getComputedStyle(parent);
                addDebug(`👨‍👩‍👧‍👦 Parent ${level} - Display: ${parentStyle.display}, Visibility: ${parentStyle.visibility}, Opacity: ${parentStyle.opacity}`);
                parent = parent.parentElement;
                level++;
            }
        }

        function forceVisibility() {
            addDebug("🔧 === FORÇAGE VISIBILITÉ ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            if (!container) {
                addDebug("❌ Container non trouvé");
                return;
            }
            
            // Forcer la visibilité du container
            container.classList.add('force-visible');
            container.style.setProperty("display", "block", "important");
            container.style.setProperty("visibility", "visible", "important");
            container.style.setProperty("opacity", "1", "important");
            container.style.setProperty("position", "relative", "important");
            container.style.setProperty("z-index", "9999", "important");
            container.style.setProperty("background", "yellow", "important");
            container.style.setProperty("border", "3px solid green", "important");
            container.style.setProperty("min-height", "50px", "important");
            container.style.setProperty("width", "100%", "important");
            
            addDebug("✅ Styles forcés appliqués au container");
            
            // Forcer la visibilité du phone container
            const phoneContainer = container.querySelector(".simple-phone-container");
            if (phoneContainer) {
                phoneContainer.style.setProperty("display", "flex", "important");
                phoneContainer.style.setProperty("visibility", "visible", "important");
                phoneContainer.style.setProperty("opacity", "1", "important");
                phoneContainer.style.setProperty("position", "relative", "important");
                phoneContainer.style.setProperty("z-index", "10000", "important");
                phoneContainer.style.setProperty("background", "orange", "important");
                phoneContainer.style.setProperty("border", "2px solid red", "important");
                phoneContainer.style.setProperty("min-height", "40px", "important");
                phoneContainer.style.setProperty("width", "100%", "important");
                
                addDebug("✅ Styles forcés appliqués au phone container");
            }
            
            // Vérifier après forçage
            setTimeout(checkVisibility, 100);
        }

        function resetTest() {
            addDebug("🔄 === RESET TEST ===");
            
            const container = document.querySelector("#simple-country-selector-container");
            if (container) {
                container.innerHTML = "";
                container.className = "";
                container.removeAttribute('style');
                addDebug("✅ Container reseté");
            }
            
            document.getElementById('status-container').innerHTML = "";
            document.getElementById('debug-panel').innerHTML = "<strong>Debug Panel:</strong><br>Reset effectué...";
            document.getElementById('css-debug').innerHTML = "<strong>CSS Debug:</strong><br>En attente...";
            
            // Réinitialiser le sélecteur
            setTimeout(initSimpleCountrySelector, 500);
        }

        function initSimpleCountrySelector() {
            addDebug("🔍 === DÉBUT INITIALISATION ===");
            
            const waitForContainer = () => {
                const container = document.querySelector("#simple-country-selector-container");
                if (!container) {
                    addDebug("⏳ Container non trouvé, nouvelle tentative dans 50ms...");
                    setTimeout(waitForContainer, 50);
                    return;
                }
                
                addDebug("✅ Container trouvé");
                initializeSelector(container);
            };

            const initializeSelector = (container) => {
                if (typeof SimpleCountrySelector === "undefined") {
                    addDebug("❌ SimpleCountrySelector n'est pas défini");
                    setTimeout(() => {
                        if (typeof SimpleCountrySelector !== "undefined") {
                            initializeSelector(container);
                        } else {
                            addDebug("❌ SimpleCountrySelector toujours non disponible");
                            addStatus("Erreur: SimpleCountrySelector non disponible", "error");
                        }
                    }, 200);
                    return;
                }

                try {
                    container.innerHTML = "";
                    addDebug("🔧 Container nettoyé");

                    // Forcer l'affichage du container
                    container.style.setProperty("display", "block", "important");
                    container.style.setProperty("visibility", "visible", "important");
                    container.style.setProperty("opacity", "1", "important");
                    container.style.setProperty("position", "relative", "important");
                    container.style.setProperty("z-index", "1000", "important");
                    container.style.setProperty("min-height", "48px", "important");
                    container.style.setProperty("width", "100%", "important");
                    container.style.setProperty("background", "lightblue", "important");
                    container.style.setProperty("border", "2px solid blue", "important");

                    addDebug("🔧 Styles de base appliqués au container");

                    // Initialiser le sélecteur
                    window.simpleCountrySelector = new SimpleCountrySelector(container, {
                        defaultCountry: "FR",
                        placeholder: "Numéro de téléphone",
                    });

                    addDebug("✅ Sélecteur créé");

                    // Fonction pour récupérer le numéro complet
                    window.getPhoneNumber = function () {
                        return window.simpleCountrySelector
                            ? window.simpleCountrySelector.getFullPhoneNumber()
                            : "";
                    };

                    // Écouter les changements
                    container.addEventListener("countryChanged", function (e) {
                        addDebug("🌍 Pays sélectionné: " + e.detail.country.name);
                    });

                    addDebug("✅ Sélecteur de pays initialisé avec succès");
                    addStatus("✅ Sélecteur de pays initialisé avec succès", "success");

                    // Vérification après initialisation
                    setTimeout(() => {
                        checkVisibility();
                        addDebug("🔍 Vérification post-initialisation terminée");
                    }, 500);

                } catch (error) {
                    addDebug("❌ Erreur lors de l'initialisation: " + error.message);
                    addStatus("❌ Erreur lors de l'initialisation: " + error.message, "error");
                }
            };

            waitForContainer();
        }

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            addDebug("📄 Page chargée, début de l'initialisation");
            initSimpleCountrySelector();
        });
    </script>
</body>
</html>
