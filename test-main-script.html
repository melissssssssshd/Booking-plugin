<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Script Principal</title>
    <link rel="stylesheet" href="assets/css/booking-form.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 2rem;
        }
        .test-section {
            background: white;
            padding: 1.5rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-controls {
            text-align: center;
            margin: 2rem 0;
        }
        .test-controls button {
            background: #1f2937;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 0 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .test-controls button:hover {
            background: #374151;
        }
        .debug-console {
            background: #1f2937;
            color: #e5e7eb;
            border-radius: 4px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-ok { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-warning { background: #f59e0b; }
    </style>
</head>
<body>
    <!-- Variables WordPress simulées -->
    <script>
        window.ajaxurl = "admin-ajax.php";
        window.ib_nonce = "test_nonce";
        window.bookingServices = [
            {id: 1, name: "Coiffure", duration: 60, price: 50},
            {id: 2, name: "Manucure", duration: 30, price: 25}
        ];
        window.bookingEmployees = [
            {id: 1, name: "Marie Dupont"},
            {id: 2, name: "Sophie Martin"}
        ];
    </script>

    <div class="test-section">
        <h2>🧪 Test Script Principal - booking-form-main.js</h2>
        <div id="statusInfo">
            <p><span class="status-indicator" id="jsIndicator"></span><strong>JavaScript:</strong> <span id="jsStatus">Chargement...</span></p>
            <p><span class="status-indicator" id="domIndicator"></span><strong>DOM:</strong> <span id="domStatus">Chargement...</span></p>
            <p><strong>Étape actuelle:</strong> <span id="currentStep">-</span></p>
        </div>
    </div>

    <!-- Template du plugin -->
    <div class="test-section">
        <h3>Template du plugin</h3>
        <div id="plugin-template">
            <!-- Le template sera chargé ici -->
        </div>
    </div>

    <!-- Contrôles de test -->
    <div class="test-section">
        <h3>Contrôles de navigation</h3>
        <div class="test-controls">
            <button onclick="testSetStep(1)">Étape 1</button>
            <button onclick="testSetStep(2)">Étape 2</button>
            <button onclick="testSetStep(3)">Étape 3</button>
            <button onclick="testSetStep(4)">Étape 4</button>
            <button onclick="testSetStep(5)">Étape 5</button>
        </div>
        
        <div style="text-align: center; margin-top: 1rem;">
            <button onclick="runDiagnostic()" style="background: #059669; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px;">
                🔍 Diagnostic
            </button>
            <button onclick="clearConsole()" style="background: #6b7280; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; margin-left: 0.5rem;">
                🗑️ Vider console
            </button>
        </div>
    </div>

    <!-- Console de debug -->
    <div class="test-section">
        <h3>Console de debug</h3>
        <div id="debugConsole" class="debug-console">
            Initialisation...
        </div>
    </div>

    <!-- Charger jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        let debugMessages = [];
        
        // Intercepter les console.log
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        function addDebugMessage(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            debugMessages.push(`[${timestamp}] ${type.toUpperCase()}: ${message}`);
            updateDebugConsole();
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addDebugMessage('log', args.join(' '));
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addDebugMessage('warn', args.join(' '));
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addDebugMessage('error', args.join(' '));
        };
        
        function updateDebugConsole() {
            const console = document.getElementById('debugConsole');
            if (console) {
                console.innerHTML = debugMessages.slice(-30).join('\n');
                console.scrollTop = console.scrollHeight;
            }
        }
        
        function clearConsole() {
            debugMessages = [];
            updateDebugConsole();
        }
        
        function updateStatus() {
            const jsStatus = document.getElementById('jsStatus');
            const domStatus = document.getElementById('domStatus');
            const currentStep = document.getElementById('currentStep');
            const jsIndicator = document.getElementById('jsIndicator');
            const domIndicator = document.getElementById('domIndicator');
            
            // Vérifier JavaScript
            if (window.bookingState && typeof window.setStep === 'function' && typeof window.updateProgressBar === 'function') {
                jsStatus.textContent = 'OK - Fonctions disponibles';
                jsIndicator.className = 'status-indicator status-ok';
                currentStep.textContent = window.bookingState.step;
            } else {
                jsStatus.textContent = 'Erreur - Fonctions non disponibles';
                jsIndicator.className = 'status-indicator status-error';
                currentStep.textContent = 'N/A';
            }
            
            // Vérifier DOM
            const steps = document.querySelectorAll('.ib-stepper-main .ib-step');
            const progressBar = document.querySelector('.ib-stepper-main .ib-stepper-progress');
            
            if (steps.length > 0 && progressBar) {
                domStatus.textContent = `OK - ${steps.length} étapes, barre trouvée`;
                domIndicator.className = 'status-indicator status-ok';
            } else {
                domStatus.textContent = `Erreur - ${steps.length} étapes, ${progressBar ? 'barre OK' : 'pas de barre'}`;
                domIndicator.className = 'status-indicator status-error';
            }
        }
        
        function testSetStep(step) {
            console.log(`Test setStep(${step})`);
            if (typeof window.setStep === 'function') {
                window.setStep(step);
                console.log(`setStep(${step}) exécuté`);
            } else {
                console.error('window.setStep non disponible');
            }
            updateStatus();
        }
        
        function runDiagnostic() {
            console.log('=== DIAGNOSTIC COMPLET ===');
            console.log(`window.bookingState: ${window.bookingState ? JSON.stringify(window.bookingState) : 'undefined'}`);
            console.log(`typeof window.setStep: ${typeof window.setStep}`);
            console.log(`typeof window.updateProgressBar: ${typeof window.updateProgressBar}`);
            
            const steps = document.querySelectorAll('.ib-stepper-main .ib-step');
            const progressBar = document.querySelector('.ib-stepper-main .ib-stepper-progress');
            console.log(`Étapes DOM: ${steps.length}`);
            console.log(`Barre progression: ${progressBar ? 'trouvée' : 'non trouvée'}`);
            
            if (progressBar) {
                console.log(`Largeur barre: ${progressBar.style.width || '0%'}`);
            }
            
            console.log('=== FIN DIAGNOSTIC ===');
            updateStatus();
        }
        
        // Charger le template et le script
        function loadTemplate() {
            console.log('Chargement du template...');
            
            fetch('templates/booking-form.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('plugin-template').innerHTML = html;
                    console.log('Template chargé');
                    
                    // Charger le script principal
                    const script = document.createElement('script');
                    script.src = 'assets/js/booking-form-main.js';
                    script.onload = function() {
                        console.log('Script booking-form-main.js chargé');
                        setTimeout(() => {
                            updateStatus();
                            runDiagnostic();
                        }, 1000);
                    };
                    script.onerror = function() {
                        console.error('Erreur lors du chargement de booking-form-main.js');
                    };
                    document.head.appendChild(script);
                })
                .catch(error => {
                    console.error('Erreur lors du chargement du template:', error);
                });
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM chargé');
            loadTemplate();
            
            // Mise à jour du statut toutes les 2 secondes
            setInterval(updateStatus, 2000);
        });
    </script>
</body>
</html>
