<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Dropdown Fix - Sélecteur de Pays</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .phone-field-with-country {
        position: relative;
        z-index: 1000;
        border: 2px solid #ddd;
        padding: 10px;
        margin: 10px 0;
      }
      #simple-country-selector-container {
        border: 2px solid #007bff;
        padding: 5px;
        margin: 5px 0;
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>🔧 Test Dropdown Fix - Sélecteur de Pays</h1>

      <div id="status-container"></div>

      <div class="form-group">
        <label for="phone">Téléphone (test dropdown fix)</label>
        <div class="phone-field-with-country">
          <div id="simple-country-selector-container"></div>
          <input id="client-phone" type="hidden" value="" />
        </div>
      </div>

      <div
        id="debug-info"
        style="
          background: #f0f0f0;
          padding: 15px;
          border-radius: 8px;
          margin-top: 20px;
          font-family: monospace;
          font-size: 12px;
        "
      >
        <strong>Debug Info:</strong><br />
        Test du dropdown fix...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="testDropdownClick()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🖱️ Tester Clic Dropdown
        </button>
        <button
          onclick="testCountrySelection()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🌍 Tester Sélection Pays
        </button>
        <button
          onclick="testSearch()"
          style="
            padding: 10px;
            margin: 5px;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
          "
        >
          🔍 Tester Recherche
        </button>
        <button
          onclick="checkVisibility()"
          style="
            padding: 10px;
            margin: 5px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          👁️ Vérifier Visibilité
        </button>
      </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message) {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();
        debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      function testDropdownClick() {
        addDebug("🖱️ === TEST CLIC DROPDOWN ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const selector = container.querySelector(".simple-country-selector");
        const dropdown = container.querySelector(".simple-dropdown");

        if (!selector) {
          addDebug("❌ Sélecteur non trouvé");
          return;
        }

        // Vérifier l'état initial
        const initialDisplay = dropdown.style.display;
        addDebug(`📊 État initial dropdown: ${initialDisplay}`);

        // Simuler un clic
        selector.click();
        addDebug("🖱️ Clic simulé sur le sélecteur");

        setTimeout(() => {
          const newDisplay = dropdown.style.display;
          const isOpen = newDisplay === "block";
          addDebug(`📊 Nouvel état dropdown: ${newDisplay}`);

          if (isOpen) {
            addStatus("✅ Dropdown s'ouvre correctement", "success");
          } else {
            addStatus("❌ Dropdown ne s'ouvre pas", "error");
          }
        }, 100);
      }

      function testCountrySelection() {
        addDebug("🌍 === TEST SÉLECTION PAYS ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const dropdown = container.querySelector(".simple-dropdown");
        const countryItems = container.querySelectorAll(".simple-country-item");

        if (!dropdown || countryItems.length === 0) {
          addDebug("❌ Dropdown ou pays non trouvés");
          return;
        }

        // Ouvrir le dropdown d'abord
        if (dropdown.style.display !== "block") {
          const selector = container.querySelector(".simple-country-selector");
          selector.click();
        }

        setTimeout(() => {
          // Sélectionner le premier pays (Belgique)
          const firstCountry = countryItems[0];
          const countryName = firstCountry.querySelector(
            ".simple-country-name"
          ).textContent;
          addDebug(`🌍 Sélection du pays: ${countryName}`);

          firstCountry.click();

          setTimeout(() => {
            const flagElement = container.querySelector(".simple-flag");
            const dialElement = container.querySelector(".simple-dial");

            if (flagElement && dialElement) {
              const flag = flagElement.textContent;
              const dial = dialElement.textContent;
              addDebug(`📊 Drapeau sélectionné: ${flag}`);
              addDebug(`📊 Code sélectionné: ${dial}`);

              if (flag === "🇧🇪" && dial === "+32") {
                addStatus("✅ Sélection de pays fonctionne", "success");
              } else {
                addStatus("❌ Sélection de pays échoue", "error");
              }
            }
          }, 100);
        }, 100);
      }

      function testSearch() {
        addDebug("🔍 === TEST RECHERCHE ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const dropdown = container.querySelector(".simple-dropdown");
        const searchInput = container.querySelector(".simple-search-input");

        if (!dropdown || !searchInput) {
          addDebug("❌ Dropdown ou recherche non trouvés");
          return;
        }

        // Ouvrir le dropdown d'abord
        if (dropdown.style.display !== "block") {
          const selector = container.querySelector(".simple-country-selector");
          selector.click();
        }

        setTimeout(() => {
          // Taper dans la recherche
          searchInput.value = "France";
          searchInput.dispatchEvent(new Event("input"));
          addDebug("🔍 Recherche 'France' effectuée");

          setTimeout(() => {
            const countryItems = container.querySelectorAll(
              ".simple-country-item"
            );
            const visibleItems = Array.from(countryItems).filter(
              (item) => item.style.display !== "none"
            );

            addDebug(
              `📊 Pays visibles après recherche: ${visibleItems.length}`
            );

            if (visibleItems.length === 1) {
              addStatus("✅ Recherche fonctionne", "success");
            } else {
              addStatus("❌ Recherche ne fonctionne pas", "error");
            }
          }, 100);
        }, 100);
      }

      function checkVisibility() {
        addDebug("👁️ === VÉRIFICATION VISIBILITÉ ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const phoneContainer = container.querySelector(
          ".simple-phone-container"
        );
        const dropdown = container.querySelector(".simple-dropdown");

        if (phoneContainer) {
          const rect = phoneContainer.getBoundingClientRect();
          const isVisible = rect.width > 0 && rect.height > 0;
          addDebug(
            `📊 Container visible: ${isVisible} (${rect.width}x${rect.height})`
          );

          if (isVisible) {
            addStatus("✅ Container visible", "success");
          } else {
            addStatus("❌ Container non visible", "error");
          }
        }

        if (dropdown) {
          const computedStyle = window.getComputedStyle(dropdown);
          const zIndex = computedStyle.zIndex;
          const position = computedStyle.position;
          addDebug(`📊 Dropdown z-index: ${zIndex}`);
          addDebug(`📊 Dropdown position: ${position}`);

          if (zIndex === "1002" && position === "absolute") {
            addStatus("✅ Styles dropdown corrects", "success");
          } else {
            addStatus("❌ Styles dropdown incorrects", "error");
          }
        }
      }

      function initSimpleCountrySelector() {
        addDebug("🔍 === DÉBUT INITIALISATION ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        if (!container) {
          addDebug("❌ Container non trouvé");
          addStatus("❌ Container non trouvé", "error");
          return;
        }

        addDebug("✅ Container trouvé");

        if (typeof SimpleCountrySelector === "undefined") {
          addDebug("❌ SimpleCountrySelector n'est pas défini");
          addStatus("❌ SimpleCountrySelector non disponible", "error");
          return;
        }

        try {
          container.innerHTML = "";
          addDebug("🔧 Container nettoyé");

          // Forcer l'affichage du container
          container.style.setProperty("display", "block", "important");
          container.style.setProperty("visibility", "visible", "important");
          container.style.setProperty("opacity", "1", "important");
          container.style.setProperty("position", "relative", "important");
          container.style.setProperty("z-index", "1000", "important");
          container.style.setProperty("min-height", "48px", "important");
          container.style.setProperty("width", "100%", "important");

          addDebug("🔧 Styles de base appliqués");

          // Initialiser le sélecteur avec France par défaut
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "FR",
            placeholder: "Numéro de téléphone",
          });

          addDebug("✅ Sélecteur créé");

          // Fonction pour récupérer le numéro complet
          window.getPhoneNumber = function () {
            return window.simpleCountrySelector
              ? window.simpleCountrySelector.getFullPhoneNumber()
              : "";
          };

          // Écouter les changements
          container.addEventListener("countryChanged", function (e) {
            addDebug("🌍 Pays sélectionné: " + e.detail.country.name);
          });

          addDebug("✅ Sélecteur de pays initialisé avec succès");
          addStatus("✅ Sélecteur de pays initialisé avec succès", "success");

          // Vérification finale
          setTimeout(() => {
            const phoneContainer = container.querySelector(
              ".simple-phone-container"
            );
            const dropdown = container.querySelector(".simple-dropdown");

            if (phoneContainer) {
              const rect = phoneContainer.getBoundingClientRect();
              const isVisible = rect.width > 0 && rect.height > 0;
              addDebug(
                `🔍 Vérification visibilité: ${isVisible} (${rect.width}x${rect.height})`
              );

              if (isVisible) {
                addStatus("✅ Sélecteur visible et fonctionnel", "success");
              } else {
                addStatus("⚠️ Sélecteur créé mais pas visible", "warning");
              }
            }

            if (dropdown) {
              addDebug("✅ Dropdown créé");
              addStatus("✅ Dropdown créé", "success");
            } else {
              addDebug("❌ Dropdown non créé");
              addStatus("❌ Dropdown non créé", "error");
            }
          }, 500);
        } catch (error) {
          addDebug("❌ Erreur lors de l'initialisation: " + error.message);
          addStatus(
            "❌ Erreur lors de l'initialisation: " + error.message,
            "error"
          );
        }
      }

      // Initialisation au chargement de la page
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("📄 Page chargée, début de l'initialisation");
        initSimpleCountrySelector();
      });
    </script>
  </body>
</html>
