<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostic Téléphone - Problème Capture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
      .form-group {
        margin: 20px 0;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #374151;
      }
      .phone-container {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }
      .debug-info {
        background: #f0f0f0;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-family: monospace;
        font-size: 12px;
        max-height: 400px;
        overflow-y: auto;
      }
      .debug-section {
        margin: 10px 0;
        padding: 10px;
        background: #e9ecef;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>🔍 Diagnostic Téléphone - Problème Capture</h1>

      <div id="status-container"></div>

      <form id="test-form">
        <div class="form-group">
          <label>Téléphone</label>
          <div
            id="simple-country-selector-container"
            class="phone-container"
          ></div>
        </div>
      </form>

      <div class="debug-info" id="debug-info">
        <strong>Debug Info:</strong><br />
        Diagnostic du problème de capture téléphone...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="diagnoseStepByStep()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🔍 Diagnostic Étape par Étape
        </button>
        <button
          onclick="testInitialization()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🚀 Tester Initialisation
        </button>
        <button
          onclick="testValidation()"
          style="
            padding: 10px;
            margin: 5px;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
          "
        >
          ✅ Tester Validation
        </button>
        <button
          onclick="forceFix()"
          style="
            padding: 10px;
            margin: 5px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🔧 Forcer Correction
        </button>
      </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message, section = "") {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();

        if (section) {
          let sectionDiv = debugInfo.querySelector(
            `[data-section="${section}"]`
          );
          if (!sectionDiv) {
            sectionDiv = document.createElement("div");
            sectionDiv.className = "debug-section";
            sectionDiv.setAttribute("data-section", section);
            sectionDiv.innerHTML = `<strong>${section}:</strong><br>`;
            debugInfo.appendChild(sectionDiv);
          }
          sectionDiv.innerHTML += `[${timestamp}] ${message}<br>`;
        } else {
          debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        }

        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      function diagnoseStepByStep() {
        addDebug("🔍 === DIAGNOSTIC ÉTAPE PAR ÉTAPE ===", "DIAGNOSTIC");

        // Étape 1: Vérifier les classes disponibles
        addDebug("📋 Étape 1: Vérification des classes", "DIAGNOSTIC");
        addDebug(
          `window.SimpleCountrySelector: ${typeof window.SimpleCountrySelector}`,
          "DIAGNOSTIC"
        );
        addDebug(
          `window.simpleCountrySelector: ${typeof window.simpleCountrySelector}`,
          "DIAGNOSTIC"
        );

        // Étape 2: Vérifier le container
        addDebug("📋 Étape 2: Vérification du container", "DIAGNOSTIC");
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        addDebug(`Container trouvé: ${!!container}`, "DIAGNOSTIC");
        if (container) {
          addDebug(
            `Container HTML: ${container.innerHTML.substring(0, 200)}...`,
            "DIAGNOSTIC"
          );
        }

        // Étape 3: Vérifier les fonctions globales
        addDebug(
          "📋 Étape 3: Vérification des fonctions globales",
          "DIAGNOSTIC"
        );
        addDebug(
          `window.getPlanityCountryCode: ${typeof window.getPlanityCountryCode}`,
          "DIAGNOSTIC"
        );
        addDebug(
          `window.getPlanityPhoneNumber: ${typeof window.getPlanityPhoneNumber}`,
          "DIAGNOSTIC"
        );

        // Étape 4: Tester les fonctions si elles existent
        if (window.getPlanityCountryCode) {
          const countryCode = window.getPlanityCountryCode();
          addDebug(`getPlanityCountryCode() = "${countryCode}"`, "DIAGNOSTIC");
        }

        if (window.getPlanityPhoneNumber) {
          const phoneNumber = window.getPlanityPhoneNumber();
          addDebug(`getPlanityPhoneNumber() = "${phoneNumber}"`, "DIAGNOSTIC");
        }

        // Étape 5: Vérifier l'instance du sélecteur
        if (window.simpleCountrySelector) {
          addDebug("📋 Étape 5: Vérification de l'instance", "DIAGNOSTIC");
          addDebug(
            `Instance créée: ${!!window.simpleCountrySelector}`,
            "DIAGNOSTIC"
          );
          addDebug(
            `Container de l'instance: ${!!window.simpleCountrySelector
              .container}`,
            "DIAGNOSTIC"
          );

          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          addDebug(`Champ téléphone trouvé: ${!!phoneInput}`, "DIAGNOSTIC");
          if (phoneInput) {
            addDebug(`Valeur du champ: "${phoneInput.value}"`, "DIAGNOSTIC");
          }

          addDebug(
            `Pays sélectionné: ${window.simpleCountrySelector.selectedCountry.name}`,
            "DIAGNOSTIC"
          );
          addDebug(
            `Code pays: ${window.simpleCountrySelector.selectedCountry.dial}`,
            "DIAGNOSTIC"
          );
        } else {
          addDebug("❌ Aucune instance trouvée", "DIAGNOSTIC");
        }
      }

      function testInitialization() {
        addDebug("🚀 === TEST INITIALISATION ===", "INIT");

        // Supprimer l'ancienne instance
        if (window.simpleCountrySelector) {
          addDebug("🗑️ Suppression de l'ancienne instance", "INIT");
          delete window.simpleCountrySelector;
        }

        // Recréer l'instance
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        if (container && window.SimpleCountrySelector) {
          addDebug("🔄 Création d'une nouvelle instance", "INIT");
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "DZ",
            placeholder: "Numéro de téléphone",
          });
          addDebug("✅ Nouvelle instance créée", "INIT");

          // Saisir un numéro de test
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneInput.value = "558769610";
            addDebug("📱 Numéro de test saisi: 558769610", "INIT");
          }

          // Vérifier immédiatement
          setTimeout(() => {
            const currentValue = phoneInput.value;
            const fullNumber =
              window.simpleCountrySelector.getFullPhoneNumber();
            addDebug(
              `📱 Vérification immédiate - Valeur: "${currentValue}"`,
              "INIT"
            );
            addDebug(
              `📱 Vérification immédiate - Complet: "${fullNumber}"`,
              "INIT"
            );
          }, 100);
        } else {
          addDebug("❌ Impossible de recréer l'instance", "INIT");
        }
      }

      function testValidation() {
        addDebug("✅ === TEST VALIDATION ===", "VALIDATION");

        // Simuler la validation WordPress
        let validIntl = false;
        let validCustom = false;
        let country = "";
        let fullPhoneNumber = "";
        let phoneValue = "";

        addDebug("🔍 [DEBUG] Validation téléphone - début", "VALIDATION");
        addDebug(
          `🔍 [DEBUG] window.simpleCountrySelector: ${window.simpleCountrySelector}`,
          "VALIDATION"
        );

        // Récupérer la valeur du champ téléphone depuis le sélecteur personnalisé
        if (window.simpleCountrySelector) {
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneValue = phoneInput.value;
            addDebug(
              `🔍 [DEBUG] phoneInput trouvé, valeur: "${phoneValue}"`,
              "VALIDATION"
            );
          } else {
            addDebug(
              "🔍 [DEBUG] phoneInput non trouvé dans le sélecteur",
              "VALIDATION"
            );
          }
        } else {
          addDebug("🔍 [DEBUG] Aucun sélecteur disponible", "VALIDATION");
        }

        // Vérifier que les fonctions globales sont disponibles
        if (window.getPlanityCountryCode && window.getPlanityPhoneNumber) {
          country = window.getPlanityCountryCode().replace("+", "");
          fullPhoneNumber = window.getPlanityPhoneNumber();
          validIntl = fullPhoneNumber.length >= 10;
          validCustom = /^[0-9\s\-\(\)]{8,15}$/.test(phoneValue.trim());
          addDebug("🔍 [DEBUG] Fonctions globales utilisées", "VALIDATION");
        } else {
          addDebug(
            "🔍 [DEBUG] Aucune méthode de validation disponible",
            "VALIDATION"
          );
        }

        addDebug(
          `[PHONE VALIDATION] {value: '${phoneValue}', fullPhoneNumber: '${fullPhoneNumber}', country: '${country}', validIntl: ${validIntl}, validCustom: ${validCustom}, usingPlanity: ${!!window.getPlanityCountryCode}, selectorExists: ${!!window.simpleCountrySelector}}`,
          "VALIDATION"
        );
      }

      function forceFix() {
        addDebug("🔧 === FORCER CORRECTION ===", "CORRECTION");

        // Étape 1: Forcer l'initialisation
        addDebug("🔧 Étape 1: Forcer l'initialisation", "CORRECTION");
        testInitialization();

        // Étape 2: Forcer la réexposition des fonctions globales
        setTimeout(() => {
          addDebug(
            "🔧 Étape 2: Réexposition des fonctions globales",
            "CORRECTION"
          );
          if (window.simpleCountrySelector) {
            window.getPlanityCountryCode = function () {
              return window.simpleCountrySelector.getCountryCode();
            };
            window.getPlanityPhoneNumber = function () {
              return window.simpleCountrySelector.getFullPhoneNumber();
            };
            addDebug("✅ Fonctions globales réexposées", "CORRECTION");
          }
        }, 200);

        // Étape 3: Tester la validation
        setTimeout(() => {
          addDebug(
            "🔧 Étape 3: Test de validation après correction",
            "CORRECTION"
          );
          testValidation();
        }, 500);
      }

      // Initialisation
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("🔍 Page chargée, diagnostic téléphone", "INIT");

        // Initialiser le sélecteur
        const container = document.getElementById(
          "simple-country-selector-container"
        );
        if (container && window.SimpleCountrySelector) {
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "DZ",
            placeholder: "Numéro de téléphone",
          });
          addDebug("✅ Sélecteur initialisé avec DZ par défaut", "INIT");

          // Saisir un numéro de test
          const phoneInput =
            window.simpleCountrySelector.container.querySelector(
              ".simple-phone-input"
            );
          if (phoneInput) {
            phoneInput.value = "558769610";
            addDebug("📱 Numéro de test saisi: 558769610", "INIT");
          }

          // Diagnostic automatique après 1 seconde
          setTimeout(() => {
            diagnoseStepByStep();
          }, 1000);
        } else {
          addDebug("❌ Impossible d'initialiser le sélecteur", "INIT");
        }
      });
    </script>
  </body>
</html>
