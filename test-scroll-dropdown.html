<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Scroll Dropdown - Sélecteur de Pays</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .test-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .phone-field-with-country {
        position: relative;
        z-index: 1000;
        border: 2px solid #ddd;
        padding: 10px;
        margin: 10px 0;
      }
      #simple-country-selector-container {
        border: 2px solid #007bff;
        padding: 5px;
        margin: 5px 0;
      }
      .status {
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: 500;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h1>📜 Test Scroll Dropdown - Sélecteur de Pays</h1>

      <div id="status-container"></div>

      <div class="form-group">
        <label for="phone">Téléphone (test scroll)</label>
        <div class="phone-field-with-country">
          <div id="simple-country-selector-container"></div>
          <input id="client-phone" type="hidden" value="" />
        </div>
      </div>

      <div
        id="debug-info"
        style="
          background: #f0f0f0;
          padding: 15px;
          border-radius: 8px;
          margin-top: 20px;
          font-family: monospace;
          font-size: 12px;
        "
      >
        <strong>Debug Info:</strong><br />
        Test du scroll interne...
      </div>

      <div style="margin-top: 20px">
        <button
          onclick="testScrollDropdown()"
          style="
            padding: 10px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          📜 Tester Scroll
        </button>
        <button
          onclick="openDropdown()"
          style="
            padding: 10px;
            margin: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
          "
        >
          🔽 Ouvrir Dropdown
        </button>
        <button
          onclick="checkScrollHeight()"
          style="
            padding: 10px;
            margin: 5px;
            background: #ffc107;
            color: black;
            border: none;
            border-radius: 4px;
          "
        >
          📏 Vérifier Hauteur
        </button>
      </div>
    </div>

    <script src="assets/js/simple-country-selector.js"></script>
    <script>
      function addStatus(message, type = "info") {
        const container = document.getElementById("status-container");
        const statusDiv = document.createElement("div");
        statusDiv.className = `status ${type}`;
        statusDiv.textContent = message;
        container.appendChild(statusDiv);
      }

      function addDebug(message) {
        const debugInfo = document.getElementById("debug-info");
        const timestamp = new Date().toLocaleTimeString();
        debugInfo.innerHTML += `<br>[${timestamp}] ${message}`;
        debugInfo.scrollTop = debugInfo.scrollHeight;
      }

      function testScrollDropdown() {
        addDebug("📜 === TEST SCROLL DROPDOWN ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const dropdown = container.querySelector(".simple-dropdown");
        const countriesList = container.querySelector(".simple-countries-list");

        if (!dropdown || !countriesList) {
          addDebug("❌ Dropdown ou liste non trouvés");
          return;
        }

        // Vérifier que le dropdown est ouvert
        if (dropdown.style.display !== "block") {
          addDebug("🖱️ Ouverture du dropdown pour le test...");
          const selector = container.querySelector(".simple-country-selector");
          if (selector) selector.click();
        }

        setTimeout(() => {
          const maxHeight = window.getComputedStyle(countriesList).maxHeight;
          const scrollHeight = countriesList.scrollHeight;
          const clientHeight = countriesList.clientHeight;
          const hasScroll = scrollHeight > clientHeight;

          addDebug(`📊 Max-height: ${maxHeight}`);
          addDebug(`📊 Scroll height: ${scrollHeight}px`);
          addDebug(`📊 Client height: ${clientHeight}px`);
          addDebug(`📊 A un scroll: ${hasScroll}`);

          if (hasScroll) {
            addStatus("✅ Scroll interne fonctionne", "success");
          } else {
            addStatus("⚠️ Pas de scroll nécessaire", "warning");
          }
        }, 100);
      }

      function openDropdown() {
        addDebug("🔽 === OUVERTURE DROPDOWN ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const selector = container.querySelector(".simple-country-selector");

        if (selector) {
          selector.click();
          addDebug("🖱️ Clic sur le sélecteur");
          addStatus("✅ Dropdown ouvert", "success");
        }
      }

      function checkScrollHeight() {
        addDebug("📏 === VÉRIFICATION HAUTEUR ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        const dropdown = container.querySelector(".simple-dropdown");
        const countriesList = container.querySelector(".simple-countries-list");

        if (dropdown && countriesList) {
          const dropdownMaxHeight = window.getComputedStyle(dropdown).maxHeight;
          const listMaxHeight =
            window.getComputedStyle(countriesList).maxHeight;

          addDebug(`📊 Dropdown max-height: ${dropdownMaxHeight}`);
          addDebug(`📊 Liste max-height: ${listMaxHeight}`);

          if (dropdownMaxHeight === "200px" && listMaxHeight === "150px") {
            addStatus("✅ Hauteurs correctes", "success");
          } else {
            addStatus("❌ Hauteurs incorrectes", "error");
          }
        }
      }

      function initSimpleCountrySelector() {
        addDebug("🔍 === DÉBUT INITIALISATION ===");

        const container = document.querySelector(
          "#simple-country-selector-container"
        );
        if (!container) {
          addDebug("❌ Container non trouvé");
          addStatus("❌ Container non trouvé", "error");
          return;
        }

        addDebug("✅ Container trouvé");

        if (typeof SimpleCountrySelector === "undefined") {
          addDebug("❌ SimpleCountrySelector n'est pas défini");
          addStatus("❌ SimpleCountrySelector non disponible", "error");
          return;
        }

        try {
          container.innerHTML = "";
          addDebug("🔧 Container nettoyé");

          // Forcer l'affichage du container
          container.style.setProperty("display", "block", "important");
          container.style.setProperty("visibility", "visible", "important");
          container.style.setProperty("opacity", "1", "important");
          container.style.setProperty("position", "relative", "important");
          container.style.setProperty("z-index", "1000", "important");
          container.style.setProperty("min-height", "48px", "important");
          container.style.setProperty("width", "100%", "important");

          addDebug("🔧 Styles de base appliqués");

          // Initialiser le sélecteur avec France par défaut
          window.simpleCountrySelector = new SimpleCountrySelector(container, {
            defaultCountry: "FR",
            placeholder: "Numéro de téléphone",
          });

          addDebug("✅ Sélecteur créé");

          // Fonction pour récupérer le numéro complet
          window.getPhoneNumber = function () {
            return window.simpleCountrySelector
              ? window.simpleCountrySelector.getFullPhoneNumber()
              : "";
          };

          // Écouter les changements
          container.addEventListener("countryChanged", function (e) {
            addDebug("🌍 Pays sélectionné: " + e.detail.country.name);
          });

          addDebug("✅ Sélecteur de pays initialisé avec succès");
          addStatus("✅ Sélecteur de pays initialisé avec succès", "success");

          // Vérification finale
          setTimeout(() => {
            const phoneContainer = container.querySelector(
              ".simple-phone-container"
            );
            const dropdown = container.querySelector(".simple-dropdown");
            const countriesList = container.querySelector(
              ".simple-countries-list"
            );

            if (phoneContainer) {
              const rect = phoneContainer.getBoundingClientRect();
              const isVisible = rect.width > 0 && rect.height > 0;
              addDebug(
                `🔍 Vérification visibilité: ${isVisible} (${rect.width}x${rect.height})`
              );

              if (isVisible) {
                addStatus("✅ Sélecteur visible et fonctionnel", "success");
              } else {
                addStatus("⚠️ Sélecteur créé mais pas visible", "warning");
              }
            }

            if (dropdown && countriesList) {
              addDebug("✅ Dropdown et liste créés");
              addStatus("✅ Dropdown avec scroll créé", "success");
            } else {
              addDebug("❌ Dropdown ou liste non créés");
              addStatus("❌ Problème de création", "error");
            }
          }, 500);
        } catch (error) {
          addDebug("❌ Erreur lors de l'initialisation: " + error.message);
          addStatus(
            "❌ Erreur lors de l'initialisation: " + error.message,
            "error"
          );
        }
      }

      // Initialisation au chargement de la page
      document.addEventListener("DOMContentLoaded", function () {
        addDebug("📄 Page chargée, début de l'initialisation");
        initSimpleCountrySelector();
      });
    </script>
  </body>
</html>
